plugins { id 'com.android.application' }
android {
    namespace 'org.geany.insight'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '30.0.16248370'
    defaultConfig {
        applicationId 'org.geany.insight'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DINSIGHT_GEANY_PLUGIN=OFF' } }
    }
    externalNativeBuild { cmake { path '../../CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
