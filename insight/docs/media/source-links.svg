<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320"><rect width="780" height="320" fill="#edf3f8"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#316ac5"/></marker></defs><g font-family="sans-serif" fill="#182330"><text x="24" y="32" font-size="21" font-weight="bold">Source Links — session navigation</text><rect x="24" y="58" width="280" height="66" rx="5" fill="white" stroke="#316ac5"/><text x="40" y="84" font-size="17">Search Results</text><text x="40" y="108" font-size="14">Stable row identity through sorting</text><rect x="474" y="58" width="280" height="66" rx="5" fill="white" stroke="#316ac5"/><text x="490" y="84" font-size="17">Editor line / byte range</text><text x="490" y="108" font-size="14">UTF-8 + CRLF edit tracking</text><path d="M312 90H464" fill="none" stroke="#316ac5" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="356" y="74" font-size="16">Ctrl+L</text><rect x="24" y="158" width="222" height="126" rx="5" fill="white" stroke="#7194ae"/><text x="40" y="186" font-size="17">Insert / delete before</text><text x="40" y="213" font-size="14">Offsets and line numbers move</text><text x="40" y="242" font-size="14">Link remains attached</text><rect x="278" y="158" width="222" height="126" rx="5" fill="white" stroke="#7194ae"/><text x="294" y="186" font-size="17">Delete entire target line</text><text x="294" y="213" font-size="14">Invalidate; never guess a neighbor</text><text x="294" y="242" font-size="14">Fresh search creates a new link</text><rect x="532" y="158" width="222" height="126" rx="5" fill="white" stroke="#7194ae"/><text x="548" y="186" font-size="17">Closed / changed target</text><text x="548" y="213" font-size="14">Open and verify snapshot</text><text x="548" y="242" font-size="14">Refuse stale source addresses</text></g></svg>