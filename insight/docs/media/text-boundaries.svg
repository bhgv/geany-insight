<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250"><rect width="760" height="250" rx="12" fill="#172437"/><g font-family="sans-serif" fill="#eef4ff"><text x="24" y="34" font-size="21">Smart line boundaries · repeated commands</text><text x="24" y="79" font-size="17">Beginning</text><text x="24" y="133" font-size="17">End</text></g><g font-family="sans-serif" font-size="17" fill="#9ae6cb"><text x="160" y="79">first text → line start → file start</text><text x="160" y="133">last text → line end → file end</text></g><path d="M24 160 H736" stroke="#52667f"/><g font-family="sans-serif" font-size="15" fill="#eef4ff"><text x="24" y="189">Extend Mode / explicit Select: keep the anchor</text><text x="24" y="215">Select Sentence: active caret → next literal period → EOF</text><text x="24" y="239">Navigation preserves text, savepoint and Undo history</text></g></svg>
