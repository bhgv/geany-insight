<rect x="282" y="55" width="255" height="200" rx="9" fill="#dcfce7"/><text x="298" y="82" font-size="17" font-weight="bold">Context completion</text><g font-size="14"><text x="298" y="113">object.ru → run(int count)</text><rect x="298" y="131" width="223" height="31" rx="5" fill="#bbf7d0"/><text x="308" y="152">run([int count])</text><text x="298" y="195">Tab → next editable field</text><text x="298" y="235">One insertion • one Undo</text></g>
