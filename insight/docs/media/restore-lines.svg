<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220"><rect width="700" height="220" fill="#f4f6fa"/><g font-family="sans-serif" font-size="18" fill="#243348"><text x="24" y="32">Open / открыть → original snapshot / исходный снимок</text><rect x="24" y="55" width="300" height="100" fill="#dae8fc" stroke="#5379aa"/><text x="40" y="89">Edited block / изменённый блок</text><text x="40" y="128">Preview → Restore → one Undo</text><text x="360" y="89">Original block / исходный блок</text><text x="360" y="128">Save keeps original snapshot</text><text x="24" y="193">Close releases snapshot / закрытие освобождает снимок</text></g></svg>