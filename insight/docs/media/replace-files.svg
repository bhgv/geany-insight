<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320"><rect width="1000" height="320" rx="16" fill="#152338"/><g font-family="sans-serif" fill="#eef5ff"><text x="28" y="40" font-size="24">Replace Files • preview before changing editor buffers</text><g font-size="18"><rect x="25" y="75" width="270" height="100" rx="12" fill="#27507a"/><text x="45" y="108">Project / folder / documents</text><text x="45" y="140">Masks • patterns • regions</text><rect x="365" y="75" width="270" height="100" rx="12" fill="#316255"/><text x="385" y="108">Preview + individual choices</text><text x="385" y="140">Colors • line numbers • Diff</text><rect x="705" y="75" width="270" height="100" rx="12" fill="#655186"/><text x="725" y="108">Recheck every source</text><text x="725" y="140">Apply • one Undo per file</text><path d="M300 125h55m-10-8 10 8-10 8M640 125h55m-10-8 10 8-10 8" stroke="#9dc8f7" stroke-width="3" fill="none"/><text x="30" y="225">Confirm each file: Replace / Skip / Cancel before buffer changes</text><text x="30" y="265">Source changed or read-only → preview again • disk unchanged until normal Save</text><text x="30" y="300" fill="#b6cce7" font-size="15">Bounded UTF-8 and regular expressions • exact CRLF and untouched text preservation</text></g></g></svg>