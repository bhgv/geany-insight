<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"><rect width="760" height="340" rx="16" fill="#edf2fa"/><g font-family="sans-serif" font-size="16" fill="#27374e"><text x="24" y="30" font-weight="bold">Responsive terminal · 10,000 scrollback lines · configurable buffer</text><rect x="24" y="48" width="712" height="94" rx="9" fill="#000"/><text x="40" y="76" fill="#ddd" font-family="monospace">user@host:~$</text><text x="40" y="106" fill="#65d67d" font-family="monospace">VT100 / xterm · UTF-8 · SGR · alternate screen</text><rect x="24" y="167" width="220" height="62" rx="10" fill="#d7e5fa"/><rect x="270" y="167" width="220" height="62" rx="10" fill="#d7e5fa"/><rect x="516" y="167" width="220" height="62" rx="10" fill="#d7e5fa"/><text x="42" y="193">Local shell</text><text x="42" y="215">native VTE / PTY</text><text x="288" y="193">SSH sessions 1…16</text><text x="288" y="215">OpenSSH · separate SCP</text><text x="534" y="193">TTY sessions 1…16</text><text x="534" y="215">COM / termios · no transfer</text><rect x="657" y="57" width="58" height="30" rx="8" fill="#d7e5fa" opacity="0.8"/><text x="674" y="79">Ai</text><text x="24" y="266">Terminals → Local / SSH / TTY</text><text x="24" y="294">Ai → floating window · editable prompt · recent requests · top 4</text><text x="24" y="320">Select a question → review context → Send → review Diff / Merge</text></g></svg>