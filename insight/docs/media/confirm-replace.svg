<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250"><rect width="760" height="250" rx="16" fill="#142638"/><g font-family="sans-serif" fill="#eef5ff"><text x="25" y="38" font-size="22">Confirm replacements · Result</text><g font-size="16"><text x="25" y="76">1. Preflight all matches and expanded replacements</text><text x="25" y="115">2. Review: Replace / Skip / Replace remaining</text><text x="25" y="154">3. Apply approved edits together → one Undo</text><text x="25" y="204" fill="#ffd68a">Cancel or changed revision → discard staged decisions</text></g></g></svg>