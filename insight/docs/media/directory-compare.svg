  <path d="M54 49v142M345 49v142M570 49v142M24 81h752M24 115h752M24 149h752" fill="none" stroke="#c6d3df"/>
  <g font-size="15"><text x="70" y="71" font-weight="bold">Relative path</text><text x="360" y="71" font-weight="bold">Status</text><text x="586" y="71" font-weight="bold">Next action</text>
   <text x="34" y="104" fill="#2e7142">=</text><text x="70" y="104">src/common.c</text><text x="360" y="104">Same content</text><text x="586" y="104">Filter or inspect</text>
