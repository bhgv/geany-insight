<svg xmlns="http://www.w3.org/2000/svg" width="850" height="370" viewBox="0 0 850 370"><rect width="850" height="370" rx="12" fill="#eef1f6"/><g font-family="sans-serif" fill="#253146"><text x="24" y="32" font-size="20">Window mode and macOS appearance are independent</text><rect x="24" y="48" width="802" height="38" rx="8" fill="#fff"/><text x="38" y="73" font-size="15">Mode: Classic | macOS | Independent Windows · S-curve 0.8 s</text><text x="24" y="114" font-size="16">Appearance: select one, keep the window mode</text><rect x="24" y="130" width="254" height="56" rx="9" fill="#edf0f6" stroke="#aab3c4"/><text x="38" y="164" font-size="15" fill="#253146">Original macOS</text><rect x="298" y="130" width="254" height="56" rx="9" fill="#e7f0fa" stroke="#aab3c4"/><text x="312" y="164" font-size="15" fill="#253146">Golden Gate 27 · Light</text><rect x="572" y="130" width="254" height="56" rx="9" fill="#292d36" stroke="#aab3c4"/><text x="586" y="164" font-size="15" fill="#e8edf6">Golden Gate 27 · Dark</text><rect x="24" y="202" width="254" height="56" rx="9" fill="#d9f4ef" stroke="#aab3c4"/><text x="38" y="236" font-size="15" fill="#23364d">Tahoe 26 · Glass</text><rect x="298" y="202" width="254" height="56" rx="9" fill="#dedfe4" stroke="#aab3c4"/><text x="312" y="236" font-size="15" fill="#30323a">Sequoia 15 · Silver</text><rect x="572" y="202" width="254" height="56" rx="0" fill="#fff" stroke="#aab3c4"/><text x="586" y="236" font-size="15" fill="#111">Macintosh · System 7</text><text x="24" y="307" font-size="15">Native GTK title buttons · height ≤ 85% of the caption</text><text x="24" y="335" font-size="15">Source font, syntax colors and Undo remain independent.</text><text x="24" y="357" font-size="11" fill="#667085">Schematic overview; real widget captures are produced by Linux GUI tests.</text></g></svg>