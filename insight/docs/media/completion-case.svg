<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190"><rect width="720" height="190" rx="12" fill="#f1f5f9"/><g font-family="sans-serif" fill="#172554"><text x="18" y="28" font-size="17" font-weight="bold">Completion case matching</text><text x="18" y="64" font-size="14">Case-sensitive: on</text><text x="18" y="104" font-size="14">Case-sensitive: off</text><text x="18" y="144" font-size="14">Prefer typed case</text></g><g font-family="monospace" font-size="16" fill="#1d4ed8"><text x="220" y="64">bErR → no match</text><text x="220" y="104">bErR → BerryCount, berryCount, BERRY_MODE</text><text x="220" y="144">berry → berryCount selected first</text></g><text x="18" y="177" font-family="sans-serif" font-size="12" fill="#475569">Bounded casefold expansion keeps language/scope visibility and original identifier spelling.</text></svg>
