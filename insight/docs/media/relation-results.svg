<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="title desc"><title id="title">Relation snapshots and bookmark batches</title><desc id="desc">Loaded filtered relation rows produce an explicit outline snapshot. Copy or open a new buffer; a guarded background source snapshot creates deduplicated bookmarks without editing source files.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf3ff"/><stop offset="1" stop-color="#f2eaf7"/></linearGradient></defs><rect width="860" height="350" rx="18" fill="url(#bg)"/><g font-family="sans-serif" fill="#26374b"><text x="28" y="36" font-size="23" font-weight="bold">Relations → review → keep useful locations</text><rect x="26" y="63" width="243" height="224" rx="12" fill="#fff" stroke="#9daec8"/><text x="42" y="91" font-size="17" font-weight="bold">Loaded / filtered model</text><g font-family="monospace" font-size="15"><text x="44" y="125">Root</text><text x="62" y="153">Middle</text><text x="80" y="181">End</text><text x="62" y="209">Other</text></g><text x="42" y="260" font-size="14">Unopened branches stay unloaded</text><path d="M278 165h36m-8-7 8 7-8 7" fill="none" stroke="#55749c" stroke-width="3"/><rect x="324" y="63" width="232" height="224" rx="12" fill="#fff" stroke="#9daec8"/><text x="340" y="91" font-size="17" font-weight="bold">Outline snapshot</text><text x="340" y="125" font-size="15">Names · paths · lines</text><text x="340" y="158" font-size="15">Refresh explicitly</text><text x="340" y="191" font-size="15">Copy complete outline</text><text x="340" y="224" font-size="15">Open new unsaved buffer</text><path d="M565 165h36m-8-7 8 7-8 7" fill="none" stroke="#55749c" stroke-width="3"/><rect x="611" y="63" width="222" height="224" rx="12" fill="#fff" stroke="#9daec8"/><text x="627" y="91" font-size="17" font-weight="bold">Create bookmarks</text><text x="627" y="125" font-size="15">Background source snapshots</text><text x="627" y="158" font-size="15">Skip duplicate locations</text><text x="627" y="191" font-size="15">Recheck before saving</text><text x="627" y="224" font-size="15">Whole batch or no changes</text><text x="28" y="324" font-size="15">Source text and Undo stay intact. Existing 64-note capacity applies; oversized batches are refused.</text></g></svg>
