<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1018" role="img" aria-labelledby="title">
  <title id="title">C/C++ Debugger buttons, command console and Watch graph</title>
  <rect width="620" height="1018" rx="12" fill="#eef4fa"/>
  <g fill="#fff" stroke="#6d88a7">
    <rect x="20" y="22" width="580" height="42" rx="8"/>
    <rect x="20" y="80" width="350" height="96" rx="8"/>
    <rect x="388" y="80" width="212" height="96" rx="8"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#162d45">
    <text x="40" y="49">Run · Continue · Step Into · Step Over · Step Out · Pause</text>
    <text x="40" y="109">Console</text>
    <text x="408" y="109">Watch graph</text>
  </g>
  <g font-family="monospace" font-size="15" fill="#345b80">
    <text x="40" y="143">break main</text>
    <text x="408" y="143">marker = 41</text>
  </g>
  <rect x="20" y="192" width="580" height="120" rx="8" fill="#fff" stroke="#6d88a7"/>
  <g fill="none" stroke="#8a50ae" stroke-width="2">
    <path d="M43 242v48h18M43 262h18"/>
  </g>
  <g font-family="sans-serif" font-size="15">
    <text x="36" y="217" fill="#162d45">All thread stacks / Стеки всех потоков</text>
    <text x="36" y="241" fill="#8a50ae">▾ Thread 2 / Поток 2</text>
    <text x="65" y="265" fill="#167c70">#0 worker → worker.c:24</text>
    <text x="65" y="290" fill="#167c70">#1 start_thread → pthread_create.c:447</text>
  </g>
  <rect x="20" y="330" width="580" height="138" rx="8" fill="#fff" stroke="#6d88a7"/>
  <g font-family="sans-serif" font-size="15" fill="#162d45">
    <text x="36" y="354">Launch / Запуск: arguments + working directory</text>
    <text x="36" y="379">Pause / Пауза → Continue / Продолжить</text>
    <text x="36" y="403">Stop / Остановить → Restart / Перезапустить</text>
    <text x="36" y="431">● Breakpoint / Точка: enabled · condition · ignored hits</text>
    <text x="36" y="454">○ Disabled / Выключена: configuration is kept</text>
  </g>
  <rect x="20" y="486" width="580" height="144" rx="8" fill="#fff" stroke="#6d88a7"/>
  <g font-family="sans-serif" font-size="15" fill="#162d45">
    <text x="36" y="510">Inspect values / Дерево значений</text>
    <text x="56" y="537" fill="#167c70">sample: struct Sample</text>
    <text x="80" y="562">count: int = 7 → Change Value / Изменить значение</text>
    <text x="80" y="588">values: int[260] → 128 + 128 + 4</text>
    <text x="36" y="614">Data watchpoint / По данным: marker · 41 → 42</text>
  </g>
  <path d="M62 543v39h10M62 558h10" fill="none" stroke="#8a50ae" stroke-width="2"/>
  <rect x="20" y="646" width="580" height="108" rx="8" fill="#fff" stroke="#6d88a7"/>
  <g font-family="sans-serif" font-size="15" fill="#162d45">
    <text x="36" y="670">Memory / Память: &amp;variable · pointer · 0x1000</text>
    <text x="36" y="697" font-family="monospace">0x1000  47 44 42 20 6d 65 6d 6f 72 79 | GDB memory</text>
    <text x="36" y="727">1–4096 bytes / байтов · Previous / Назад · Next / Вперёд</text>
  </g>
  <rect x="20" y="770" width="580" height="228" rx="8" fill="#fff" stroke="#6d88a7"/>
  <g font-family="sans-serif" font-size="15" fill="#162d45">
    <text x="36" y="795">Remote / Удалённо: local symbols + GDB client</text>
    <text x="36" y="822">127.0.0.1 → SSH tunnel / туннель → gdbserver</text>
    <text x="36" y="849">remote: Continue / Продолжить</text>
    <text x="36" y="876">extended-remote: Run · Stop · Restart</text>
    <text x="36" y="901">/build/project → local sources / локальные исходники</text>
    <text x="36" y="936">Profile / Профиль: source points + watch expressions</text>
    <text x="36" y="973">Save → Reopen → Connect / Run</text>
  </g>
</svg>
