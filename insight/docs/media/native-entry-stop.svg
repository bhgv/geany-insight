<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
  <title id="title">Stop at main / Остановка в main</title>
  <desc id="desc">Run or Restart with entry stopping enabled pauses in main; Continue resumes the same process. A temporary breakpoint disappears after hitting main.</desc>
  <rect width="680" height="300" rx="14" fill="#edf3f8"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#18334d">
    <text x="340" y="32" font-size="19">Stop at main / Остановиться в main</text>
    <g fill="#fff" stroke="#7892aa">
      <rect x="24" y="65" width="190" height="90" rx="9"/>
      <rect x="245" y="65" width="190" height="90" rx="9"/>
      <rect x="466" y="65" width="190" height="90" rx="9"/>
      <rect x="100" y="208" width="480" height="65" rx="9"/>
    </g>
    <g font-size="16">
      <text x="119" y="97">Run / Restart</text><text x="119" y="125">Запуск / Перезапуск</text>
      <text x="340" y="97">Paused in main</text><text x="340" y="125">Пауза в main</text>
      <text x="561" y="97">Continue</text><text x="561" y="125">Тот же процесс</text>
      <text x="340" y="234">Temporary breakpoint removed after the stop</text>
      <text x="340" y="257">Временная точка удаляется после остановки</text>
    </g>
  </g>
  <g stroke="#7892aa" fill="none" stroke-width="2">
    <path d="M214 110h25m-6-6 6 6-6 6M435 110h25m-6-6 6 6-6 6M340 155v45m-6-6 6 6 6-6"/>
  </g>
</svg>
