<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230">
 <rect width="800" height="230" rx="14" fill="#f3f6fa"/>
 <g font-family="sans-serif" fill="#182b42">
  <text x="24" y="32" font-size="20" font-weight="bold">File Compare: original bytes → selected blocks → result</text>
  <rect x="24" y="54" width="218" height="112" rx="9" fill="#ffe0d0" stroke="#ae6a40"/>
  <text x="40" y="80" font-size="17" font-weight="bold">Left · read only</text>
  <text x="40" y="106" font-size="15">Initial result and ignored text</text><text x="40" y="130" font-size="15">keep this source’s bytes.</text>
  <rect x="290" y="54" width="220" height="112" rx="9" fill="#fff" stroke="#516b89"/>
  <text x="306" y="80" font-size="17" font-weight="bold">Result · editable</text>
  <text x="306" y="106" font-size="15">Take Left / Take Right</text><text x="306" y="130" font-size="15">One action → Undo / Redo</text>
  <rect x="558" y="54" width="218" height="112" rx="9" fill="#d5f5d5" stroke="#4c864c"/>
  <text x="574" y="80" font-size="17" font-weight="bold">Right · read only</text>
  <text x="574" y="106" font-size="15">Selected blocks copy their</text><text x="574" y="130" font-size="15">original, unmodified bytes.</text>
  <path d="M246 111h36m-8-6 8 6-8 6M554 111h-36m8-6-8 6 8 6" fill="none" stroke="#516b89" stroke-width="2"/>
  <text x="24" y="194" font-size="15">Compare runs in a worker. Cancel keeps the previous comparison and history.</text>
  <text x="24" y="217" font-size="14">View options persist. Overview navigates; Edit File opens the source caret line.</text>
 </g>
</svg>
