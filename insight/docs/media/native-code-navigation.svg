<svg xmlns="http://www.w3.org/2000/svg" width="820" height="270" viewBox="0 0 820 270" role="img" aria-labelledby="title desc">
<title id="title">Code history / История кода</title>
<desc id="desc">Confirmed address history with back, forward and return to PC. История подтверждённых адресов с возвратом и переходом к PC.</desc>
<rect width="820" height="270" rx="12" fill="#edf3f9"/>
<g font-family="sans-serif" fill="#17334d">
<text x="24" y="34" font-size="20">Read code without running / Чтение кода без исполнения</text>
<rect x="24" y="62" width="218" height="76" rx="8" fill="#fff" stroke="#6685a3"/>
<rect x="302" y="62" width="218" height="76" rx="8" fill="#fff" stroke="#6685a3"/>
<rect x="580" y="62" width="216" height="76" rx="8" fill="#fff2ad" stroke="#6685a3"/>
<text x="44" y="92" font-size="18">0x4010</text>
<text x="44" y="120" font-size="15">Earlier / Ранее</text>
<text x="322" y="92" font-size="18">0x5200</text>
<text x="322" y="120" font-size="15">Viewed / Просмотрено</text>
<text x="600" y="92" font-size="18">$pc → 0x4030</text>
<text x="600" y="120" font-size="15">Current PC / Текущий PC</text>
<path d="M250 86 H294 M250 86 l9 -6 M250 86 l9 6 M294 86 l-9 -6 M294 86 l-9 6" fill="none" stroke="#385d80" stroke-width="2"/>
<text x="251" y="117" font-size="12">← / →</text>
<path d="M528 100 H572 l-9 -6 M572 100 l-9 6" fill="none" stroke="#385d80" stroke-width="2"/>
<text x="24" y="178" font-size="16">Back / Назад · Forward / Вперёд · Return to PC / Вернуться к PC</text>
<text x="24" y="211" font-size="15">64 confirmed addresses / 64 подтверждённых адреса · errors keep position / ошибка сохраняет позицию</text>
<text x="24" y="244" font-size="15">Exit clears history / Завершение очищает историю · no execution / без исполнения программы</text>
</g>
</svg>
