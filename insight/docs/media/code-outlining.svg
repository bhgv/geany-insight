<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290"><rect width="820" height="290" rx="12" fill="#172435"/><g font-family="sans-serif" fill="#edf3fa"><text x="24" y="34" font-size="22">Code outlining · native lexer blocks</text><g font-family="monospace" font-size="18"><text x="30" y="80" fill="#8fcaff">− outer() {</text><text x="56" y="114" fill="#9ed3a4">− if (…) {</text><text x="82" y="148">+ while (…) { … }</text><text x="56" y="182">}</text><text x="30" y="216">}</text></g><rect x="390" y="58" width="404" height="174" rx="7" fill="#2c425c"/><g font-size="17"><text x="408" y="88">Current block → one fold header</text><text x="408" y="122">Branch → header and all descendants</text><text x="408" y="156">Level → visible nesting depth</text><text x="408" y="190">Browser → filter · inspect · navigate</text><text x="24" y="266">Read-only sources supported · no source edits or Undo entries</text></g></g></svg>