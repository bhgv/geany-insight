<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250"><rect width="960" height="250" rx="14" fill="#edf2f8"/><g font-family="sans-serif" fill="#23364d"><text x="24" y="32" font-size="19" font-weight="bold">Custom Commands · shared tabbed options</text><g font-size="16" text-anchor="middle"><rect x="24" y="64" width="200" height="66" rx="10" fill="#d7e6fb"/><text x="124" y="92">Saved tools</text><text x="124" y="114">name · arguments · folder</text><path d="M230 97h36m-9-7 9 7-9 7" stroke="#426ba1" fill="none" stroke-width="2"/><rect x="272" y="64" width="200" height="66" rx="10" fill="#d7e6fb"/><text x="372" y="92">Preview</text><text x="372" y="114">literal substitutions</text><path d="M478 97h36m-9-7 9 7-9 7" stroke="#426ba1" fill="none" stroke-width="2"/><rect x="520" y="64" width="160" height="66" rx="10" fill="#d8efe3"/><text x="600" y="92">Run / Stop</text><text x="600" y="114">one process</text><path d="M686 97h36m-9-7 9 7-9 7" stroke="#426ba1" fill="none" stroke-width="2"/><rect x="728" y="64" width="208" height="66" rx="10" fill="#d8efe3"/><text x="832" y="92">Output log</text><text x="832" y="114">copy · save · clear</text></g><text x="24" y="172" font-size="16">Context: file · project · caret line · word · %1–%9</text><text x="24" y="205" font-size="16">Preview never runs a tool. Run never silently saves or replaces source buffers.</text><text x="24" y="232" font-size="14">UTF-8 output · bounded capture · persistent profiles · session-only argument values</text></g></svg>