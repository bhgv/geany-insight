<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 325" role="img" aria-labelledby="title desc">
  <title id="title">Refresh paused data / Обновление данных на паузе</title>
  <desc id="desc">Assignment or manual refresh rereads locals, watches and the open tree. Register and address caches are invalidated; memory follows its refresh policy.</desc>
  <rect width="700" height="325" rx="14" fill="#edf3f8"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#18334d">
    <text x="350" y="30" font-size="18">Assignment or Refresh / Присваивание или Обновить</text>
    <g fill="#fff" stroke="#7892aa">
      <rect x="20" y="65" width="310" height="80" rx="9"/>
      <rect x="370" y="65" width="310" height="80" rx="9"/>
      <rect x="20" y="205" width="310" height="80" rx="9"/>
      <rect x="370" y="205" width="310" height="80" rx="9"/>
    </g>
    <g font-size="16">
      <text x="175" y="98">Locals · Watches · Value tree</text><text x="175" y="125">Перечитать в выбранном кадре</text>
      <text x="525" y="98">Register and address caches</text><text x="525" y="125">Сбросить зависимые снимки</text>
      <text x="175" y="237">Memory auto-refresh ON</text><text x="175" y="264">Перечитать блок памяти</text>
      <text x="525" y="237">Memory auto-refresh OFF</text><text x="525" y="264">Очистить; затем Read Memory</text>
      <text x="350" y="311">No stepping / Без шага и Continue</text>
    </g>
  </g>
  <g fill="none" stroke="#7892aa" stroke-width="2">
    <path d="M350 38v13H175v10m175-10h175v10M350 145v30H175v26m175-26h175v26"/>
    <path d="m169 55 6 6 6-6m338 0 6 6 6-6m-362 140 6 6 6-6m338 0 6 6 6-6"/>
  </g>
</svg>
