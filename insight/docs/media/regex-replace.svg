<svg xmlns="http://www.w3.org/2000/svg" width="820" height="294" viewBox="0 0 820 294"><rect width="820" height="294" rx="14" fill="#f3f6fa"/><g font-family="sans-serif" fill="#17354a"><text x="24" y="34" font-size="21">Regex search and atomic replacement</text><rect x="24" y="55" width="218" height="145" rx="8" fill="#fff" stroke="#99afc2"/><text x="40" y="83" font-size="17">UTF-8 snapshot</text><text x="40" y="113" font-size="15">Left / Right / Result</text><text x="40" y="140" font-size="15">CR, LF and CRLF</text><text x="40" y="178" font-size="14">Text limit: 1 MiB</text><path d="M248 126h24m-8-8 8 8-8 8" fill="none" stroke="#2671a3" stroke-width="3"/><rect x="282" y="55" width="244" height="145" rx="8" fill="#fff" stroke="#99afc2"/><text x="298" y="83" font-size="17">Perl-compatible pattern</text><text x="298" y="113" font-size="15">Case / whole words / dot-all</text><text x="298" y="140" font-size="15">Groups and empty matches</text><text x="298" y="178" font-size="14">Compile and work limits</text><path d="M532 126h24m-8-8 8 8-8 8" fill="none" stroke="#2671a3" stroke-width="3"/><rect x="566" y="55" width="230" height="145" rx="8" fill="#fff" stroke="#99afc2"/><text x="582" y="83" font-size="17">Inspect or replace</text><text x="582" y="113" font-size="15">Match list / preview count</text><text x="582" y="140" font-size="15">Result or selected range</text><text x="582" y="178" font-size="14">One Undo / Redo batch</text><text x="24" y="235" font-size="16">Validate pattern, capture expansion and result size before changing text.</text><text x="24" y="267" font-size="16">Errors reject the whole replacement batch; source files stay read-only.</text></g></svg>