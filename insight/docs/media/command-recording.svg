<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220"><rect width="860" height="220" rx="14" fill="#edf2f8"/><g font-family="sans-serif" font-size="17" fill="#20344d"><text x="24" y="32" font-weight="bold">Editor command recording / Запись команд</text><g fill="#fff" stroke="#7189a6"><rect x="24" y="58" width="185" height="92" rx="10"/><rect x="235" y="58" width="185" height="92" rx="10"/><rect x="446" y="58" width="185" height="92" rx="10"/><rect x="657" y="58" width="179" height="92" rx="10"/></g><text x="40" y="88">1. Start / Начать</text><text x="40" y="121">Type, move, delete</text><text x="251" y="88">2. Stop / Стоп</text><text x="251" y="121">Inspect commands</text><text x="462" y="88">3. Play / Повтор</text><text x="462" y="121">At current caret</text><text x="673" y="88">4. Undo / Отмена</text><text x="673" y="121">One grouped edit</text><path d="M210 104h24m186 0h25m186 0h25" stroke="#7189a6" stroke-width="3"/><text x="24" y="188" font-size="15">256 actions · 64 KiB text · workspace save opt-in · explicit replay · no clipboard access</text></g></svg>
