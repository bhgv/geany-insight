  </defs>
  <rect width="600" height="220" rx="16" fill="#f2f6fc"/>
  <g fill="#fff" stroke="#6984a5" stroke-width="1.5">
    <rect x="25" y="34" width="174" height="54" rx="8"/>
    <rect x="242" y="34" width="154" height="54" rx="8"/>
    <rect x="439" y="34" width="136" height="54" rx="8"/>
