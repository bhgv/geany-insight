<svg xmlns="http://www.w3.org/2000/svg" width="680" height="210" viewBox="0 0 680 210" role="img" aria-labelledby="title"><title id="title">File type editing: independent indentation and screen or typing wraps</title><rect x="1" y="1" width="678" height="208" rx="12" fill="#f3f6fa" stroke="#bcccdc"/><g font-family="sans-serif" font-size="14" fill="#243b53"><text x="20" y="28">1 · Tabs + spaces</text><text x="350" y="28">2 · Wrap modes</text><text x="20" y="61">Tab width: 8 columns</text><text x="20" y="89">Indent step: 2 columns</text><text x="350" y="61">Screen wrap → display only</text><text x="350" y="123">Typing wrap → inserts ↵</text></g><g font-family="monospace" font-size="15" fill="#243b53"><text x="20" y="133">··if (ready) {</text><text x="20" y="159">····work();</text><text x="20" y="185">··}</text><text x="350" y="86">long text…</text><text x="365" y="106">continued</text><text x="350" y="151">long text… ↵</text><text x="350" y="177">next line</text></g><path d="M330 20v170" stroke="#bcccdc"/><path d="M24 116h14m0 0-4-4m4 4-4 4" fill="none" stroke="#238636" stroke-width="2"/></svg>
