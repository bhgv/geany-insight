<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" role="img" aria-labelledby="title">
  <title id="title">Bit mapping for out = {data[0], data[7]}</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#27609a"/>
    </marker>
  </defs>
  <rect width="440" height="180" rx="12" fill="#f2f6fc"/>
  <g fill="#fff" stroke="#6984a5">
    <rect x="28" y="52" width="120" height="38" rx="6"/>
    <rect x="28" y="112" width="120" height="38" rx="6"/>
    <rect x="292" y="52" width="120" height="38" rx="6"/>
    <rect x="292" y="112" width="120" height="38" rx="6"/>
  </g>
  <g fill="#142c48" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="220" y="30">assign out = {data[0], data[7]};</text>
