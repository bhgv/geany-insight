[Tutorial]
Title=Verilog debugger tutorial

[Step 1]
Title=1. Set up the design
Text=Open Debug Current Verilog File. In Port Signals, select the DUT module. Add a test clock to its clock input and a button to reset if needed. The Recipe tab shows the resulting rules and lets you edit them.

[Step 2]
Title=2. Choose when to finish
Text=Click Simulation time… to set a limit in nanoseconds. For 1 ms enter 1000000. Alternatively, click Clock cycle limit…, choose clk and enter the number of rising edges. If both limits are set, the first one reached ends the run.

[Step 3]
Title=3. Run the simulation
Text=Click Start Debugging. Wait for Simulator paused, then click Continue. The Running status indicates execution. To send a reset pulse, press its button in Devices. If the simulator is paused, Continue lets it process the pulse.

[Step 4]
Title=4. Start waveform capture on an edge
Text=For a first run, leave Capture trigger unset to record immediately. To start recording later, click Capture trigger…, choose a one-bit signal and select rising or falling edge. The model runs while VCD waits for that transition. The log reports Waveform capture started when it fires.

[Step 5]
Title=5. Pause on a signal or a source line
Text=To pause on an edge, first pause execution, then right-click a one-bit signal in HDL Signals and choose Stop on Signal. To stop on HDL code, press F2 on an executable line or use Source breakpoints. Leave the condition empty and Hits at 1 for the first visit. Click Continue to arm execution.

[Step 6]
Title=6. Inspect values and finish
Text=At a stop, HDL Signals shows current values. Open Preview Waveform under Inspection tools to see the recorded VCD. A live scope keeps the last 512 samples of selected signals. To finish on an edge, use a signal stop and then click Finish. The generated testbench uses a default duration when no limit is set.
