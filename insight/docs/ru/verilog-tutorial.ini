[Tutorial]
Title=Туториал по отладке Verilog

[Step 1]
Title=1. Настройка схемы
Text=Откройте «Отлаживать текущий файл Verilog». В «Настройке портов» выберите модуль схемы. Подключите тестовый клок к тактовому входу и при необходимости кнопку к сбросу. Вкладка «Рецепт» показывает правила и позволяет редактировать их.

[Step 2]
Title=2. Длительность теста
Text=Нажмите «Время симуляции…» и введите предел в наносекундах. Для 1 мс введите 1000000. Чтобы задать предел в тактах, нажмите «Число тактов…», выберите clk и введите число положительных фронтов. Если заданы оба предела, сработает первый достигнутый.

[Step 3]
Title=3. Запуск схемы
Text=Нажмите «Начать отладку». Дождитесь надписи «Симулятор на паузе» и нажмите «Продолжить». Статус «Симуляция выполняется» означает, что схема запущена. Для импульса сброса нажмите кнопку во вкладке «Устройства». Если симулятор на паузе, нажмите «Продолжить», чтобы обработать импульс.

[Step 4]
Title=4. Запись осциллограммы по перепаду
Text=Для первого прогона оставьте триггер записи незаданным, чтобы запись началась сразу. Для запуска записи по событию нажмите «Триггер записи…», выберите однобитный сигнал и укажите фронт или спад. Схема выполняется, пока VCD ждёт перепада. При срабатывании журнал покажет Waveform capture started.

[Step 5]
Title=5. Пауза по сигналу или строке HDL
Text=Для паузы по перепаду остановите выполнение, щёлкните правой кнопкой по однобитному сигналу в «Сигналах HDL» и выберите «Остановиться по сигналу…». Для точки в коде нажмите F2 на исполняемой строке или добавьте точку во вкладке «Точки останова в HDL». Для первой остановки оставьте условие пустым и число срабатываний равным 1. Нажмите «Продолжить».

[Step 6]
Title=6. Просмотр значений и завершение
Text=На паузе «Сигналы HDL» показывают текущие значения. В разделе «Просмотр и трассировка» нажмите «Осциллограмма», чтобы открыть записанный VCD. Живой осциллограф хранит последние 512 выборок выбранных сигналов. Чтобы завершить по перепаду, настройте остановку по сигналу, а после паузы нажмите «Завершить». Если предел не задан, тестбенч использует длительность по умолчанию.
