# EN: Validate Linux and Windows HDL builds together with shared native debugger regressions.
# RU: Проверяет сборки HDL для Linux и Windows и общие регрессии нативного отладчика.
name: Verilog debugger smoke

on:
  workflow_dispatch:
    inputs:
      full_clang:
        description: Also build the bundled Clang SDK
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/verilog-debugger-smoke.yml'
      - 'build.sh'
      - 'build.cmd'
      - 'insight/tools/build_editor.py'
      - 'insight/tools/build-iverilog.sh'
      - 'insight/tools/geany-vpi-devices.c'
      - 'insight/tools/geany-ddr4.h'
      - 'insight/tools/geany-sdram.h'
      - 'insight/tools/geany-i2c-eeprom.h'
      - 'insight/tools/geany-lua-*.h'
      - 'insight/vendor/lua/**'
      - 'insight/tools/geany-spi-memory.h'
      - 'insight/tools/setup-windows.ps1'
      - 'insight/tools/windows-toolchain.json'
      - 'insight/patches/geany-vvp.patch'
      - 'insight/patches/geany-iverilog-windows.patch'
      - 'insight/tests/waveform-debug/**'
      - 'insight/examples/lua-bus-devices/**'
      - 'src/insight-waveforms.*'
      - 'src/insight-waveforms/**'
      - 'src/insight-workbench.c'
      - 'src/insight-debuggers/**'
      - 'insight/tests/native_debugger*.py'
      - 'insight/tests/native_debugger*.inc'
      - 'insight/tests/native_debugger_compile_fixture.c'
      - 'insight/desktop/slang_completion.c'
      - 'external/slang-compat/**'
      - 'insight/tests/verilog_debugger_gui_test.c'
      - 'insight/tests/verilog-debugger-gui/**'
      - 'insight/tests/native_debugger_gui_test.c'
      - 'insight/tests/native_debugger_values_gui.inc'
      - 'insight/tests/native_debugger_remote_gui.inc'
      - 'insight/tests/native_debugger_catchpoints_gui.inc'
      - 'insight/tests/native_debugger_catchpoints_test.py'
      - 'insight/tests/native-debug/**'
      - 'tests/meson.build'

permissions:
  contents: read

jobs:
  build-and-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      INSIGHT_SMOKE_CLANG: ${{ inputs.full_clang && 'internal' || 'disabled' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake bison flex \
            cmake gdb gettext gperf libgtk-3-dev libreadline-dev libxml2-dev libzstd-dev \
            meson ninja-build pkg-config python3-docutils xauth xvfb zlib1g-dev
      - name: Check native debugger thread models and GDB context
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s insight/tests -p 'native_debugger*_test.py' -v
      - name: Build and install on Linux
        id: linux_build
        if: runner.os == 'Linux'
        run: |
          ./build.sh --backend meson --install --jobs 2 \
            --clang-provider "$INSIGHT_SMOKE_CLANG" --prefix "$RUNNER_TEMP/insight-editor"
      - name: Build and install on Windows
        id: windows_build
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build.cmd -NonInteractive -BuildEditor -Jobs 2 -ClangProvider %INSIGHT_SMOKE_CLANG% -RootDir "%RUNNER_TEMP%\insight-build" -InstallDir "%RUNNER_TEMP%\insight-editor"
      - name: Run installed bridge on Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python3 insight/tests/waveform-debug/smoke.py "$RUNNER_TEMP/insight-editor" "$RUNNER_TEMP/insight-smoke" --gtk
      - name: Run installed bridge on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python insight/tests/waveform-debug/smoke.py "$env:RUNNER_TEMP/insight-editor" "$env:RUNNER_TEMP/insight-smoke" --gtk
      - name: Exercise native debugger controls on Linux
        if: runner.os == 'Linux' && !cancelled() && steps.linux_build.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/insight-smoke/gtk-debugger"
          export GEANY_INSIGHT_SLANG_SERVICE="$RUNNER_TEMP/insight-editor/libexec/geany-insight/slang/insight-slang-semantic"
          xvfb-run -a _editor-build/meson/tests/test_insight_verilog_debugger_gui \
            insight/tests/waveform-debug "$RUNNER_TEMP/insight-smoke/gtk-debugger" \
            >"$RUNNER_TEMP/insight-smoke/gtk-debugger/session.log" 2>&1 || {
              cat "$RUNNER_TEMP/insight-smoke/gtk-debugger/session.log"
              exit 1
            }
      - name: Exercise live HDL devices and memory images on Linux
        if: runner.os == 'Linux' && !cancelled() && steps.linux_build.outcome == 'success'
        run: |
          directory="$RUNNER_TEMP/insight-smoke/live-devices"
          mkdir -p "$directory"
          xvfb-run -a _editor-build/meson/tests/test_insight_verilog_debugger_gui \
            insight/tests/waveform-debug "$directory" --live \
            >"$directory/session.log" 2>&1 || {
              cat "$directory/session.log"
              exit 1
            }
      - name: Exercise native debugger controls on Windows
        if: runner.os == 'Windows' && !cancelled() && steps.windows_build.outcome == 'success'
        shell: pwsh
        run: |
          $directory = "$env:RUNNER_TEMP/insight-smoke/gtk-debugger"
          New-Item -ItemType Directory -Force $directory | Out-Null
          $probe = "$env:RUNNER_TEMP/insight-editor/bin/test_insight_verilog_debugger_gui.exe"
          Copy-Item _editor-build/meson/tests/test_insight_verilog_debugger_gui.exe $probe
          $env:GEANY_INSIGHT_SLANG_SERVICE = "$env:RUNNER_TEMP/insight-editor/libexec/geany-insight/slang/insight-slang-semantic.exe"
          & $probe insight/tests/waveform-debug $directory *> "$directory/session.log"
          $code = $LASTEXITCODE
          Get-Content "$directory/session.log"
          exit $code
      - name: Exercise live HDL devices and memory images on Windows
        if: runner.os == 'Windows' && !cancelled() && steps.windows_build.outcome == 'success'
        shell: pwsh
        run: |
          $directory = "$env:RUNNER_TEMP/insight-smoke/live-devices"
          New-Item -ItemType Directory -Force $directory | Out-Null
          $probe = "$env:RUNNER_TEMP/insight-editor/bin/test_insight_verilog_debugger_gui.exe"
          Copy-Item _editor-build/meson/tests/test_insight_verilog_debugger_gui.exe $probe
          & $probe insight/tests/waveform-debug $directory --live *> "$directory/session.log"
          $code = $LASTEXITCODE
          Get-Content "$directory/session.log"
          exit $code
      - name: Exercise C/C++ debugger with GDB on Linux
        if: runner.os == 'Linux' && !cancelled() && steps.linux_build.outcome == 'success'
        run: |
          directory="$RUNNER_TEMP/insight-smoke/native-debugger"
          mkdir -p "$directory"
          cc -g -O0 insight/tests/native-debug/main.c -o "$directory/program"
          xvfb-run -a _editor-build/meson/tests/test_insight_native_debugger_gui \
            "$directory/program" insight/tests/native-debug/observer.lua "$directory/profile" \
            >"$directory/session.log" 2>&1 || {
              cat "$directory/session.log"
              exit 1
            }
      - name: Preserve build and simulator logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verilog-debugger-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            _editor-build/logs/
            ${{ runner.temp }}/insight-build/logs/
            ${{ runner.temp }}/insight-smoke/
