name: Insight Windows x64 check
on:
  push:
    branches: [main]
    paths: [insight/build-requests/windows-x64-request.txt]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insight-win64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-docutils
            gettext
            diffutils
            patch
            git
            unzip
            zip
            rsync
      - name: Check parser fixture tools
        run: |
          for tool in diff sed cp mktemp python3; do
            command -v "$tool" > /dev/null || exit 1
          done
      - name: Test tag printer record endings
        run: python insight/tests/print_tags_test.py
      - name: Test internal diff core
        run: python insight/tests/diff_test.py
      - name: Test structural selection
        run: |
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/core/structure_select.c insight/tests/structure_select_test.c -o structural-selection-test.exe
          ./structural-selection-test.exe
      - name: Test code template expansion
        run: |
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/desktop/snippet.c insight/tests/snippet_test.c -Iinsight/desktop $(pkg-config --cflags --libs gio-2.0) -o code-template-test.exe
          ./code-template-test.exe
      - name: Test relation graph geometry
        run: |
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/relation_graph_layout_test.c -o relation-graph-test.exe
          ./relation-graph-test.exe
      - name: Test search and lookup filters
        run: |
          for name in lookup_filter context_search keyword_search; do
            extra=""
            if [ "$name" = keyword_search ]; then extra="insight/desktop/context_search.c"; fi
            cc -std=c99 -Wall -Wextra -Werror -UNDEBUG "insight/tests/${name}_test.c" "insight/desktop/${name}.c" $extra -Iinsight/desktop $(pkg-config --cflags --libs glib-2.0) -o "${name}-test.exe"
            "./${name}-test.exe"
          done
      - name: Test portable bookmarks and clips
        run: |
          cc -std=c99 -Wall -Wextra -Werror insight/tests/notebook_store_test.c insight/desktop/notebook_store.c -Iinsight/desktop $(pkg-config --cflags --libs gio-2.0) -o notebook-store-test.exe
          ./notebook-store-test.exe
      - name: Test inheritance relation queries
        run: |
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/relation_query_test.c insight/desktop/relation_query.c insight/desktop/type_resolve.c insight/core/index.c -Iinsight/desktop $(pkg-config --cflags --libs glib-2.0) -o relation-query-test.exe
          ./relation-query-test.exe
      - name: Test saved panel layout migration
        run: |
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/layout_state_test.c insight/desktop/layout_state.c -Iinsight/desktop $(pkg-config --cflags --libs glib-2.0) -o layout-state-test.exe
          ./layout-state-test.exe
      - name: Test scoped type and alias resolution
        run: |
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/type_resolve_test.c insight/desktop/type_resolve.c insight/core/index.c -Iinsight/desktop $(pkg-config --cflags --libs glib-2.0) -o type-resolve-test.exe
          ./type-resolve-test.exe
      - name: Test master file list snapshots and background sync
        run: |
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/project_files_test.c insight/desktop/project_files.c -Iinsight/desktop $(pkg-config --cflags --libs gio-2.0) -o project-files-test.exe
          ./project-files-test.exe
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/master_list_test.c insight/desktop/master_list.c insight/desktop/project_files.c -Iinsight/desktop $(pkg-config --cflags --libs gio-2.0) -o master-list-test.exe
          ./master-list-test.exe
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/master_sync_test.c insight/desktop/master_sync.c insight/desktop/master_list.c insight/desktop/project_files.c -Iinsight/desktop $(pkg-config --cflags --libs gio-2.0) -o master-sync-test.exe
          ./master-sync-test.exe
      - name: Build native editor including internal merge window
        run: |
          meson setup _build --prefix="$(pwd)/portable" --libdir=lib \
            -Dhtml-docs=disabled -Dpdf-docs=disabled -Dapi-docs=disabled \
            -Dgtkdoc=false -Dvte=false -Dmac-integration=disabled \
            -Dc_args=-DINSIGHT_RELOCATABLE -Dcpp_args=-DINSIGHT_RELOCATABLE
          meson compile -C _build
          meson install -C _build
          # Meson's shebang lookup can select System32/bash.exe (WSL).
          # Invoke the already active MSYS2 shell explicitly for parser fixtures.
          set -e
          export top_srcdir="$(pwd)"
          export top_builddir="$(pwd)/_build"
          parser_count=0
          for result in tests/ctags/*.{cpp,h,c}.tags; do
            printf 'Parser fixture: %s\n' "$result"
            if [ "$result" = tests/ctags/process_order.c.tags ]; then
              /usr/bin/bash tests/ctags/runner.sh "$(pwd)/_build/geany.exe" --result "$result" tests/ctags/process_order_1.h tests/ctags/process_order_2.h
            else
              /usr/bin/bash tests/ctags/runner.sh "$(pwd)/_build/geany.exe" "$result"
            fi
            parser_count=$((parser_count + 1))
          done
          test "$parser_count" -gt 0
          printf 'C/C++ parser fixtures passed: %s\n' "$parser_count"
      - name: Test native index and lexical scope backend
        run: |
          ./_build/tests/test_insight_native_index.exe
          ./_build/tests/test_insight_python_series.exe
      - name: Test native Windows GUI migration paths
        run: |
          set -e
          mkdir -p _win-gui
          trap 'rm -f portable/bin/test_insight_*_gui.exe' EXIT
          for name in menu_alignment symbol_navigation symbol_locate grouped_project relation_transitive symbol_scopes indented_functions relation_tree relation_graph relation_tree_graph type_alias context_links python_context python_imports python_series panel_geometry snippet template_fields project_templates project_bookmarks master_list symbol_info disk_browser bookmark_anchors formatting panels; do
            cp "_build/tests/test_insight_${name}_gui.exe" portable/bin/
            (cd _win-gui && GEANY_RUN_GUI_TESTS=1 DISPLAY=win32 GDK_BACKEND=win32 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 "../portable/bin/test_insight_${name}_gui.exe")
            if [ "$name" = panels ]; then
              (cd _win-gui && GEANY_TEST_VALID_PROJECT_SPLIT=1 GEANY_RUN_GUI_TESTS=1 DISPLAY=win32 GDK_BACKEND=win32 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 "../portable/bin/test_insight_${name}_gui.exe")
            fi
          done
      - name: Bundle GTK runtime
        run: |
          mkdir -p _gtk
          (cd _gtk && bash ../scripts/gtk-bundle-from-msys2.sh -3 --ucrt64)
          rsync -a _gtk/bin/ portable/bin/
          rsync -a _gtk/lib/ portable/lib/
          rsync -a _gtk/share/ portable/share/
          if [ -d _gtk/etc ]; then rsync -a _gtk/etc/ portable/etc/; fi
      - name: Prepare portable check package
        run: |
          mkdir -p portable/examples
          cp -r insight/examples/diff-merge portable/examples/
          cp insight/examples/*.lua portable/examples/
          cp insight/examples/structural-selection.c portable/examples/
          cp insight/docs/structural-selection.md portable/STRUCTURAL-SELECTION.md
          python insight/tools/bundle_windows_dependencies.py --package portable --sdk "$(cygpath -w /ucrt64)"
          cp COPYING portable/
          cp insight/docs/internal-diff.md portable/INTERNAL-DIFF.md
          mkdir -p portable/data/insight/docs
          cp insight/docs/*.md insight/docs/*.rst portable/data/insight/docs/
          cp -r insight/docs/en insight/docs/ru portable/data/insight/docs/
          mkdir -p portable/data/insight/locale
          cp insight/locale/*.tsv portable/data/insight/locale/
          git rev-parse HEAD > portable/REVISION.txt
          python - <<'PY'
          from pathlib import Path
          Path('portable/Start-Insight.cmd').write_bytes(
              b'@echo off\r\nsetlocal\r\n'
              b'set "GEANY_INSIGHT_PREFIX=%~dp0"\r\n'
              b'set "PATH=%~dp0bin;%PATH%"\r\n'
              b'set "GSETTINGS_SCHEMA_DIR=%~dp0share\\glib-2.0\\schemas"\r\n'
              b'set "GDK_PIXBUF_MODULEDIR=%~dp0lib\\gdk-pixbuf-2.0\\2.10.0\\loaders"\r\n'
              b'set "GDK_PIXBUF_MODULE_FILE=%~dp0lib\\gdk-pixbuf-2.0\\2.10.0\\loaders.cache"\r\n'
              b'"%~dp0bin\\gdk-pixbuf-query-loaders.exe" --update-cache\r\n'
              b'"%~dp0bin\\geany.exe" -c "%~dp0config" %*\r\n')
          PY
          objdump -f portable/bin/geany.exe | tee portable/ARCHITECTURE.txt
          grep -q 'pei-x86-64' portable/ARCHITECTURE.txt
      - name: Verify portable editor without SDK on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\portable\bin;$env:SystemRoot\System32;$env:SystemRoot"
          & "$env:GITHUB_WORKSPACE\portable\bin\geany.exe" --version | Tee-Object -FilePath portable/SMOKE-TEST.txt
          if ($LASTEXITCODE -ne 0) { throw "Portable editor failed: $LASTEXITCODE" }
      - name: Upload Windows x64 portable build
        uses: actions/upload-artifact@v4
        with:
          name: geany-insight-windows-x64-check
          path: portable/
          if-no-files-found: error
          retention-days: 14
