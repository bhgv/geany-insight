name: Insight compiler built from external sources
on:
  push:
    branches: [main]
    paths:
      - .gitmodules
      - external/**
      - build.sh
      - insight/tools/build_editor.py
      - insight/tools/prepare_clang_sdk.py
      - insight/tests/editor_build_driver_test.py
      - insight/tools/build_external_clang.py
      - insight/tools/select_clang_sdk.py
      - insight/tests/clang_sdk_selection_test.py
      - configure.ac
      - insight/desktop/clang_backend.*
      - insight/desktop/clang_calls.*
      - insight/tests/clang_backend_test.c
      - meson.build
      - meson_options.txt
      - .github/workflows/insight-external-clang.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insight-external-clang-${{ github.ref }}
  # Keep a costly first compiler build; newer integration checks reuse its cache.
  cancel-in-progress: false
jobs:
  source-sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cmake: system
            cache-suffix: ''
          - cmake: '3.10.3'
            cache-suffix: '-cmake310-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned editable compiler sources
        id: compiler-pin
        run: |
          git submodule update --init --depth 1 external/llvm-project
          echo "revision=$(git -C external/llvm-project rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3 meson autoconf automake autopoint libtool pkg-config libgtk-3-dev gettext python3-docutils patchelf xvfb xauth
      - name: Select actual legacy CMake
        if: matrix.cmake != 'system'
        run: |
          python3 -m pip download --no-deps --only-binary=:all: --python-version 37 --abi cp37m --platform manylinux1_x86_64 --implementation cp --dest "$RUNNER_TEMP/cmake310" cmake==3.10.3
          python3 - <<'PYTHON'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cmake310"
          wheel = next(root.glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              archive.extractall(root / "unpacked")
          binary = root / "unpacked/cmake/data/bin"
          for tool in binary.iterdir():
              tool.chmod(0o755)
          with open(os.environ["GITHUB_PATH"], "a") as paths:
              paths.write(str(binary) + "\n")
          PYTHON
      - name: Report CMake version
        run: cmake --version
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: _external-clang
          key: external-llvm-${{ runner.os }}-${{ steps.compiler-pin.outputs.revision }}-release-x86-v1${{ matrix.cache-suffix }}
      - name: Build Clang and LLVM directly from the pinned sources
        id: sdk-build
        run: |
          compiler_jobs=$(python3 -c 'import os; memory=os.sysconf("SC_PHYS_PAGES")*os.sysconf("SC_PAGE_SIZE"); print(max(1,min(4,os.cpu_count() or 2,memory//(3*1024**3))))')
          echo "Compiler build parallelism: $compiler_jobs"
          if [ "${{ steps.compiler-cache.outputs.cache-hit }}" = "true" ]; then
            python3 insight/tools/build_external_clang.py --jobs "$compiler_jobs" --reuse-build
          else
            python3 insight/tools/build_external_clang.py --jobs "$compiler_jobs"
          fi
      - uses: actions/cache/save@v4
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: _external-clang
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Check internal SDK selection and no system fallback
        run: |
          python3 insight/tests/clang_sdk_selection_test.py
          python3 insight/tests/editor_build_driver_test.py
      - name: Verify Autotools defaults to the internal SDK
        run: |
          ./build.sh --configure-only --skip-sdk-build --build-dir "$PWD/_source-autotools" --prefix "$PWD/_source-autotools/install" -- --disable-html-docs --disable-pdf-docs --disable-api-docs --disable-gtkdoc-header
          cd _source-autotools
          ../configure --disable-html-docs --disable-pdf-docs --disable-api-docs --disable-gtkdoc-header
          grep -F 'Clang provider: internal' config.log
          grep -E '^#define HAVE_CLANG_CPP 1' config.h
      - name: Build editor with the source SDK and direct C++ AST adapter
        run: |
          meson setup _source-editor --prefix="$PWD/_source-install" --libdir=lib -Dhtml-docs=disabled -Dpdf-docs=disabled -Dapi-docs=disabled -Dgtkdoc=false -Dvte=false -Dmac-integration=disabled
          ./build.sh --backend meson --skip-sdk-build --jobs 2 --build-dir "$PWD/_source-editor" --prefix "$PWD/_source-install" --install -- --libdir=lib -Dhtml-docs=disabled -Dpdf-docs=disabled -Dapi-docs=disabled -Dgtkdoc=false -Dvte=false -Dmac-integration=disabled
      - name: Verify the editor loads the source-built compiler runtime
        run: |
          python3 - <<'PYCODE'
          import pathlib, subprocess
          root = pathlib.Path('_source-install').resolve()
          output = subprocess.check_output(['ldd', '-r', str(root / 'lib/libgeany.so')], text=True, stderr=subprocess.STDOUT)
          print(output)
          assert 'not found' not in output and 'undefined symbol:' not in output
          assert 'libclang.so' not in output
          assert not list((root / 'lib/geany/clang').glob('libclang.so*'))
          for name in ('libclang-cpp', 'libLLVM'):
              rows = [line for line in output.splitlines() if name in line]
              assert rows and all(str(root / 'lib/geany/clang') in line for line in rows), (name, output)
          PYCODE
      - name: Validate source-built semantic services and temporary workspaces
        run: |
          GEANY_INSIGHT_PREFIX="$PWD/_source-install" GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a -s '-screen 0 1600x1200x24' meson test -C _source-editor --print-errorlogs 'Insight Clang semantic frontend' 'Insight native source routes and flow GUI' 'Insight temporary open-file workspace GUI'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-clang-source-validation-${{ matrix.cmake }}
          path: |
            _external-clang-sdk/source-manifest.json
            _source-editor/meson-logs/testlog.txt
            _source-editor/meson-logs/meson-log.txt
          retention-days: 7
