name: Insight Windows toolchain bootstrap
on:
  push:
    branches: [main]
    paths:
      - external/slang
      - external/slang-compat/**
      - insight/tools/build_editor.py
      - insight/tools/build_external_slang.py
      - insight/tools/install_slang.py
      - insight/tests/slang_build_test.py
      - insight/tools/select-windows-folders.ps1
      - insight/tools/setup-windows.ps1
      - insight/tools/windows-offline.ps1
      - insight/tools/windows_bundle.py
      - insight/tests/windows_bundle_test.py
      - insight/tools/windows-toolchain.json
      - insight/tests/windows_toolchain_test.ps1
      - .github/workflows/insight-windows-toolchain.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Parse and test plans on Windows PowerShell 5.1
        shell: powershell
        run: ./insight/tests/windows_toolchain_test.ps1
      - name: Parse and test plans on PowerShell 7
        shell: pwsh
        run: ./insight/tests/windows_toolchain_test.ps1
      - name: Verify portable source exports and offline asset guards
        shell: pwsh
        run: python insight/tests/windows_bundle_test.py
      - name: Verify LF/CRLF compatibility patch and install guards
        shell: pwsh
        run: python insight/tests/slang_build_test.py
      - name: Install actual UCRT64 build tools using the pinned installer
        shell: powershell
        run: |
          ./insight/tools/setup-windows.ps1 -NonInteractive -RootDir D:\InsightBuild -MsysRoot D:\InsightBuild\tools\msys64 -CacheDir "$env:RUNNER_TEMP\insight-toolchain" -Autotools -Packaging
          if (-not (Test-Path D:\InsightBuild\tools\msys64\ucrt64\bin\gcc.exe)) { throw 'Tool installation incomplete.' }
      - name: Build and stage native slang through the common driver
        shell: powershell
        run: |
          $env:MSYSTEM='UCRT64'
          $env:CHERE_INVOKING='1'
          $script = "$env:RUNNER_TEMP/insight-slang-build.sh"
          [IO.File]::WriteAllText($script, ('cd "' + ($env:GITHUB_WORKSPACE -replace '\\','/') + '"' + "`n" + 'export CC=gcc CXX=g++' + "`n" + 'python3 insight/tools/build_editor.py --slang-only --install --prefix D:/InsightBuild/Editor' + "`n"), (New-Object Text.UTF8Encoding($false)))
          & D:\InsightBuild\tools\msys64\usr\bin\bash.exe --login ($script -replace '\\','/')
          if ($LASTEXITCODE -ne 0) { throw 'slang Windows build failed' }
          if (-not (Test-Path D:\InsightBuild\Editor\libexec\geany-insight\slang\slang.exe)) { throw 'slang missing from selected destination' }
          $env:PATH="D:\InsightBuild\tools\msys64\ucrt64\bin;$env:PATH"
          & D:\InsightBuild\tools\msys64\ucrt64\bin\python.exe external/slang-compat/semantic-test.py D:\InsightBuild\Editor\libexec\geany-insight\slang\insight-slang-semantic.exe external/slang-compat/fixtures
          if ($LASTEXITCODE -ne 0) { throw 'installed semantic service failed' }
      - name: Verify installed SDK with spaces in its path
        shell: powershell
        run: |
          $tools='D:\InsightBuild\tools\msys64\ucrt64\bin'
          $env:PATH="$tools;$env:PATH"
          & "$tools\python.exe" insight/tools/install_slang.py --build _external-slang --prefix 'D:\InsightBuild\Editor Files'
          if ($LASTEXITCODE -ne 0) { throw 'SDK staging with spaces failed' }
          $sdk='D:\InsightBuild\Editor Files\lib\geany-insight\slang'
          & "$tools\g++.exe" -std=c++17 -DSLANG_STATIC_DEFINE -DNOMINMAX -DWIN32_LEAN_AND_MEAN "-I$sdk\include" external/slang-compat/probe.cpp "-L$sdk\lib" -lsvlang -lfmt -pthread -o "$env:RUNNER_TEMP\slang-sdk-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed SDK consumer did not compile' }
          & "$env:RUNNER_TEMP\slang-sdk-probe.exe" external/slang-compat/fixtures/leaf.sv external/slang-compat/fixtures/top.sv
          if ($LASTEXITCODE -ne 0) { throw 'Installed SDK elaboration failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-location-dialogs
          path: windows-locations-*.jpg
