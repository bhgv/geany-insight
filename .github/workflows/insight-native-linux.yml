            aligned-diff.jpg
            paste-symbol.jpg
            buffer-transfer.jpg
            renumber-ranges.jpg
            replace-files.jpg
            replace-review.jpg
            editor-ai.jpg
            console-ai.jpg
            ai-review.jpg
            search-project-dialog.jpg
