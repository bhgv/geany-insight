name: Insight native Linux integration
on:
  push:
    branches: [main]
    paths:
      - src/insight-directory.*
      - insight/desktop/directory_operation.*
      - insight/tests/directory_operation*_test.c
      - insight/desktop/directory_compare.*
      - insight/tests/directory_compare*_test.c
      - insight/desktop/context_search.*
      - insight/tests/context_search_test.c
      - src/insight-workbench.*
      - src/insight-symbol-view.*
      - src/search.c
      - src/sidebar.c
      - insight/tests/unified_workbench_gui_test.c
      - src/insight-diff.*
      - insight/core/diff.*
      - insight/core/restore_lines.*
      - insight/tests/restore_lines_test.c
      - insight/tests/diff_test.py
      - insight/tests/diff_gui_test.c
      - src/insight-relation-graph.*
      - insight/core/relation_graph_layout.h
      - insight/core/relation_graph_print.h
      - insight/tests/relation_graph*_test.c
      - insight/tests/relation_tree_graph_gui_test.c
      - insight/tests/relation_history_gui_test.c
      - insight/tests/relation_nodes_gui_test.c
      - src/insight-relation-tree.*
      - insight/tests/relation_tree_gui_test.c
      - src/insight-search-links.*
      - insight/desktop/source_link_anchor.*
      - insight/tests/source_link_anchor_test.c
      - insight/tests/source_links_native_gui_test.c
      - insight/core/delimiter_navigation.*
      - insight/tests/delimiter_navigation*_test.c
      - src/insight-typing.*
      - insight/core/repeat_typing.*
      - insight/tests/repeat_typing_test.c
      - insight/tests/typing_replay_gui_test.c
      - src/insight-selection-search.*
      - insight/tests/selection_search_gui_test.c
      - src/insight-navigation.*
      - src/navqueue.*
      - src/document.*
      - insight/tests/checkpoint_gui_test.c
      - src/insight-revisions.*
      - insight/tests/restore_lines_gui_test.c
      - insight/tests/original_changes_gui_test.c
      - insight/tests/back_toggle_gui_test.c
      - src/insight-command-list.*
      - insight/tests/command_list_gui_test.c
      - insight/tests/command_browser_gui_test.c
      - insight/tests/navigation_native_gui_test.c
      - insight/tests/text_boundary_gui_test.c
      - insight/tests/viewport_gui_test.c
      - insight/tests/word_edit_gui_test.c
      - src/insight-paste.*
      - src/keybindings.c
      - src/sciwrappers.c
      - insight/desktop/intelligent_paste.*
      - insight/tests/intelligent_paste*_test.c
      - insight/desktop/completion_*
      - src/tagmanager/tm_completion.*
      - src/tagmanager/tm_workspace.*
      - src/insight-completion.*
      - insight/tests/completion*_test.c
      - src/editor.c
      - src/insight-languages.*
      - insight/desktop/filetype_*
      - insight/tests/filetype_*_test.c
      - src/insight-git.*
      - src/insight-workbench.c
      - insight/desktop/git_project.*
      - insight/tests/git_project*_test.c
      - insight/tests/git_native_gui_test.c
      - src/insight-disk-browser.*
      - insight/desktop/disk_operation.*
      - insight/desktop/folder_layout.*
      - insight/desktop/folder_tree.*
      - insight/tests/folder_layout_test.c
      - insight/tests/folder_tree*_test.c
      - insight/tests/disk_browser_gui_test.c
      - insight/desktop/project_files.*
      - insight/tests/disk_operation*_test.c
      - insight/tests/project_files_test.c
      - meson.build
      - tests/meson.build
      - .github/workflows/insight-native-linux.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insight-native-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev meson ninja-build gettext python3-docutils xvfb poppler-utils
      - name: Validate exact and normalized comparison core
        run: SANITIZE=undefined python3 insight/tests/diff_test.py
      - name: Configure and build the complete editor
        run: |
          meson setup _native --prefix="$PWD/_native-install" --libdir=lib -Dhtml-docs=disabled -Dpdf-docs=disabled -Dapi-docs=disabled -Dgtkdoc=false -Dvte=false -Dmac-integration=disabled
          meson compile -C _native
          meson install -C _native
      - name: Run native Folder Browser regressions
        run: |
          INSIGHT_SEARCH_DIALOG_CAPTURE="$PWD/search-project-dialog.jpg" INSIGHT_UNIFIED_CAPTURE="$PWD/insight-unified-workbench.jpg" INSIGHT_DIFF_REGEX_CAPTURE="$PWD/file-compare-regex.jpg" INSIGHT_DIFF_SEARCH_CAPTURE="$PWD/file-compare-search.jpg" GEANY_PASTE_DEBUG=1 GEANY_PASTE_POSITION_CAPTURE="$PWD/paste-position.jpg" GEANY_CHECKPOINT_CAPTURE="$PWD/checkpoint.jpg" GEANY_REPEAT_TYPING_CAPTURE="$PWD/repeat-typing.jpg" GEANY_TYPING_HISTORY_CAPTURE="$PWD/typing-history.jpg" GEANY_SELECTION_SEARCH_CAPTURE="$PWD/selection-search.jpg" GEANY_DELIMITER_CAPTURE="$PWD/delimiter-navigation.jpg" GEANY_ORIGINAL_CHANGES_CAPTURE="$PWD/original-changes.jpg" GEANY_RESTORE_FILE_CAPTURE="$PWD/restore-file.jpg" GEANY_RESTORE_LINES_CAPTURE="$PWD/restore-lines.jpg" GEANY_COMMAND_BROWSER_CAPTURE="$PWD/command-browser.jpg" GEANY_WORD_EDIT_CAPTURE="$PWD/word-editing.jpg" GEANY_VIEWPORT_CAPTURE="$PWD/window-scrolling.jpg" GEANY_NAVIGATION_CAPTURE="$PWD/selection-navigation.jpg" GEANY_LINE_OPERATIONS_CAPTURE="$PWD/line-operations.jpg" GEANY_INSIGHT_PREFIX="$PWD/_native-install" GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a meson test -C _native --print-errorlogs 'Insight reference comment regions GUI' 'Insight native relation history GUI' 'Insight native relation node removal GUI' 'Insight expandable Relations tree GUI' 'Insight relation graph geometry' 'Insight relation graph GUI' 'Insight expandable relation graph GUI' 'Insight relation graph viewport GUI' 'Insight relation graph printing GUI' 'Insight source link edit anchors' 'Insight native search source links GUI' 'Insight context search' 'Insight unified file search and symbols GUI' 'Insight guarded directory file operations' 'Insight directory comparison snapshots' 'Insight isolated Directory Compare GUI' 'Insight native Directory Compare routing GUI' 'Insight isolated Diff Merge GUI' 'Insight Folder Browser shape and ancestry' 'Insight guarded disk operations' 'Insight isolated disk operation dialogs GUI' 'Insight unindexed disk browser GUI' 'Insight Git project transactions' 'Insight Git project dialogs GUI' 'Insight native Git project GUI' 'Insight lazy folder tree GUI' 'Insight native lazy folder tree GUI' 'Insight file type editing settings' 'Insight file type editing page GUI' 'Insight native file type editing GUI' 'Insight native typing pairs GUI' 'Insight detailed completion native GUI' 'Insight completion case matching' 'Insight intelligent paste transforms' 'Insight intelligent paste native GUI' 'Insight native smart edges sentence and word fragments GUI' 'Insight original-line restoration plans' 'Insight native original snapshots and Restore Lines GUI' 'Insight native Checkpoint and Checkpoint All GUI' 'Insight literal typing repetition plans' 'Insight native typing replay and history GUI' 'Insight native selection search and match list GUI' 'Insight delimiter navigation core' 'Insight native delimiter navigation and enclosing pairs GUI' 'Insight native original changes and Restore File GUI' 'Insight native Go Back Toggle GUI' 'Insight native searchable command browser GUI' 'Insight native command and key reference buffers GUI' 'Insight native word cut and character line deletion GUI' 'Insight native viewport scrolling and window edges GUI' 'Insight selection navigation native GUI' 'Insight completion settings' 'Insight completion preferences GUI' 'Insight language profiles GUI' 'Insight file type filters GUI'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insight-editor-menus
          path: |
            search-project-dialog.jpg
            insight-unified-workbench.jpg
            file-compare-regex.jpg
            file-compare-search.jpg
            line-operations.jpg
            selection-navigation.jpg
            window-scrolling.jpg
            word-editing.jpg
            command-browser.jpg
            restore-lines.jpg
            original-changes.jpg
            delimiter-navigation.jpg
            selection-search.jpg
            checkpoint.jpg
            repeat-typing.jpg
            typing-history.jpg
            restore-file.jpg
            paste-position.jpg
          if-no-files-found: ignore
          retention-days: 7
