name: Insight native Linux integration
on:
  push:
    branches: [main]
    paths:
      - src/insight-navigation.*
      - insight/tests/navigation_native_gui_test.c
      - src/insight-paste.*
      - src/keybindings.c
      - src/sciwrappers.c
      - insight/desktop/intelligent_paste.*
      - insight/tests/intelligent_paste*_test.c
      - insight/desktop/completion_*
      - src/tagmanager/tm_completion.*
      - src/tagmanager/tm_workspace.*
      - src/insight-completion.*
      - insight/tests/completion*_test.c
      - src/editor.c
      - src/insight-languages.*
      - insight/desktop/filetype_*
      - insight/tests/filetype_*_test.c
      - src/insight-git.*
      - src/insight-workbench.c
      - insight/desktop/git_project.*
      - insight/tests/git_project*_test.c
      - insight/tests/git_native_gui_test.c
      - src/insight-disk-browser.*
      - insight/desktop/disk_operation.*
      - insight/desktop/folder_layout.*
      - insight/desktop/folder_tree.*
      - insight/tests/folder_layout_test.c
      - insight/tests/folder_tree*_test.c
      - insight/tests/disk_browser_gui_test.c
      - insight/desktop/project_files.*
      - insight/tests/disk_operation*_test.c
      - insight/tests/project_files_test.c
      - meson.build
      - tests/meson.build
      - .github/workflows/insight-native-linux.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insight-native-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev meson ninja-build gettext python3-docutils xvfb
      - name: Configure and build the complete editor
        run: |
          meson setup _native --prefix="$PWD/_native-install" --libdir=lib -Dhtml-docs=disabled -Dpdf-docs=disabled -Dapi-docs=disabled -Dgtkdoc=false -Dvte=false -Dmac-integration=disabled
          meson compile -C _native
          meson install -C _native
      - name: Run native Folder Browser regressions
        run: |
          GEANY_NAVIGATION_CAPTURE="$PWD/selection-navigation.jpg" GEANY_LINE_OPERATIONS_CAPTURE="$PWD/line-operations.jpg" GEANY_INSIGHT_PREFIX="$PWD/_native-install" GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a meson test -C _native --print-errorlogs 'Insight Folder Browser shape and ancestry' 'Insight guarded disk operations' 'Insight isolated disk operation dialogs GUI' 'Insight unindexed disk browser GUI' 'Insight Git project transactions' 'Insight Git project dialogs GUI' 'Insight native Git project GUI' 'Insight lazy folder tree GUI' 'Insight native lazy folder tree GUI' 'Insight file type editing settings' 'Insight file type editing page GUI' 'Insight native file type editing GUI' 'Insight native typing pairs GUI' 'Insight detailed completion native GUI' 'Insight completion case matching' 'Insight intelligent paste transforms' 'Insight intelligent paste native GUI' 'Insight selection navigation native GUI' 'Insight completion settings' 'Insight completion preferences GUI' 'Insight language profiles GUI' 'Insight file type filters GUI'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insight-editor-menus
          path: |
            line-operations.jpg
            selection-navigation.jpg
          if-no-files-found: ignore
          retention-days: 7
