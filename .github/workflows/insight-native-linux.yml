permissions:
  contents: read
concurrency:
  group: insight-native-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        timeout-minutes: 15
        run: |
          # The regional Azure mirror can take ten minutes for this package set.
          # Keep Ubuntu's signed repositories, using its main HTTPS mirror.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if test -f "$source"; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"; fi
          done
          timeout 90s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Languages=none update -qq || echo "Package index refresh unavailable; using runner package indexes"
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libgtk-3-dev libvte-2.91-dev meson ninja-build gettext python3-docutils xvfb xauth poppler-utils gdb openssh-server
          sudo mkdir -p /run/sshd
      - name: Validate exact and normalized comparison core
        run: SANITIZE=undefined python3 insight/tests/diff_test.py
      - name: Validate selection parsing without charconv
        run: SANITIZE=undefined python3 insight/tests/selection_parse_test.py
      - name: Configure and build the complete editor
        run: |
          meson setup _native --prefix="$PWD/_native-install" --libdir=lib -Dhtml-docs=disabled -Dpdf-docs=disabled -Dapi-docs=disabled -Dgtkdoc=false -Dvte=true -Dmac-integration=disabled
          meson compile -C _native
          meson install -C _native
      - name: Check active editor focus and command recording
        run: |
          GEANY_INSIGHT_PREFIX="$PWD/_native-install" GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a -s "-screen 0 1600x1200x24" meson test -C _native --print-errorlogs 'Insight native search source links GUI' 'Insight native relation node removal GUI' 'Insight native command recording GUI'
          cp _native/meson-logs/testlog.txt editor-focus-testlog.txt
      - name: Check compact panels and Context controls
        run: |
          INSIGHT_MENU_CAPTURE_DIR="$PWD" INSIGHT_MACOS_WINDOWS_CAPTURE="$PWD/macos-independent-windows.jpg" INSIGHT_APPEARANCE_CLASSIC_CAPTURE="$PWD/interface-classic.jpg" INSIGHT_APPEARANCE_MAC_CAPTURE="$PWD/interface-macos.jpg" INSIGHT_COMPACT_CAPTURE="$PWD/compact-context.jpg" GEANY_INSIGHT_PREFIX="$PWD/_native-install" GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a -s "-screen 0 1600x1200x24" meson test -C _native --print-errorlogs 'Insight panel resizing, symbol types and contextual help GUI' 'Insight language-aware Context links GUI' 'Insight legacy generated palette recovery GUI' 'Insight Python Context and tools GUI' 'Insight open window batch actions GUI' 'Insight escaped web search URLs' 'Insight native Search Web and Search Engines GUI' 'Insight shared AI profiles and parallel answer selection GUI' 'Insight native panel activation and focus commands GUI' 'Insight native Reload Modified Files guarded batches GUI' 'Insight native code outlining and block browser GUI' 'Insight independent macOS windows and minimap scale GUI' 'Insight independent macOS windows startup GUI' 'Insight classic and macOS interface styles GUI' 'Insight compact macOS menus and live materials GUI' 'Insight macOS interface style startup restore GUI' 'Insight CSS visual themes GUI' 'Insight CSS visual theme restore GUI' 'Insight CSS theme panel override GUI' 'Insight CSS theme and Cyrillic font assets'
          cp _native/meson-logs/testlog.txt compact-testlog.txt
      - name: Check SSH connection startup and failures
        run: |
          GEANY_INSIGHT_PREFIX="$PWD/_native-install" GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a -s "-screen 0 1600x1200x24" meson test -C _native --print-errorlogs 'Insight remote IO' 'Insight native SSH shell connection GUI'
          cp _native/meson-logs/testlog.txt ssh-console-testlog.txt
      - name: Run guarded text transfer checks
        run: |
          INSIGHT_ALIGNED_DIFF_CAPTURE="$PWD/aligned-diff.jpg" GEANY_PASTE_SYMBOL_CAPTURE="$PWD/paste-symbol.jpg" GEANY_BUFFER_TRANSFER_CAPTURE="$PWD/buffer-transfer.jpg" GEANY_INSIGHT_PREFIX="$PWD/_native-install" GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a -s "-screen 0 1600x1200x24" meson test -C _native --print-errorlogs 'Insight master file list snapshots' 'Insight background master file list synchronization' 'Insight master file list project GUI' 'Insight typed nonrecursive MFL directories GUI' 'Insight persistent project database' 'Insight native persistent incremental project GUI' 'Insight workspace watcher' 'Insight isolated Diff Merge GUI' 'Insight guarded symbol edit plans' 'Insight native symbol copy cut duplicate GUI' 'Insight native Paste Symbol guarded preview GUI' 'Insight bounded UTF-8 text transfer' 'Insight native Insert File Save Selection Save Copy GUI' 'Insight native buffer text transfer GUI'
          cp _native/meson-logs/testlog.txt project-db-testlog.txt
      - name: Run native Folder Browser regressions
        run: |
          INSIGHT_ALIGNED_DIFF_CAPTURE="$PWD/aligned-diff.jpg" GEANY_PASTE_SYMBOL_CAPTURE="$PWD/paste-symbol.jpg" GEANY_BUFFER_TRANSFER_CAPTURE="$PWD/buffer-transfer.jpg" GEANY_RENUMBER_RANGES_CAPTURE="$PWD/renumber-ranges.jpg" GEANY_REPLACE_REVIEW_CAPTURE="$PWD/replace-review.jpg" GEANY_REPLACE_FILES_CAPTURE="$PWD/replace-files.jpg" GEANY_EDITOR_AI_CAPTURE="$PWD/editor-ai.jpg" GEANY_CONSOLE_AI_CAPTURE="$PWD/console-ai.jpg" GEANY_AI_REVIEW_CAPTURE="$PWD/ai-review.jpg" INSIGHT_SEARCH_DIALOG_CAPTURE="$PWD/search-project-dialog.jpg" INSIGHT_UNIFIED_CAPTURE="$PWD/insight-unified-workbench.jpg" INSIGHT_DIFF_REGEX_CAPTURE="$PWD/file-compare-regex.jpg" INSIGHT_DIFF_SEARCH_CAPTURE="$PWD/file-compare-search.jpg" GEANY_PASTE_DEBUG=1 GEANY_PASTE_POSITION_CAPTURE="$PWD/paste-position.jpg" GEANY_HTML_EXPORT_CAPTURE="$PWD/html-export.jpg" GEANY_PROJECT_REPORT_CAPTURE="$PWD/project-report.jpg" GEANY_GIT_HISTORY_CAPTURE="$PWD/git-history.jpg" GEANY_SNAPSHOT_COMPARE_CAPTURE="$PWD/snapshot-comparison.jpg" GEANY_BACKUP_CAPTURE="$PWD/backup-versions.jpg" GEANY_CHECKPOINT_CAPTURE="$PWD/checkpoint.jpg" GEANY_REPEAT_TYPING_CAPTURE="$PWD/repeat-typing.jpg" GEANY_TYPING_HISTORY_CAPTURE="$PWD/typing-history.jpg" GEANY_SELECTION_SEARCH_CAPTURE="$PWD/selection-search.jpg" GEANY_DELIMITER_CAPTURE="$PWD/delimiter-navigation.jpg" GEANY_ORIGINAL_CHANGES_CAPTURE="$PWD/original-changes.jpg" GEANY_RESTORE_FILE_CAPTURE="$PWD/restore-file.jpg" GEANY_RESTORE_LINES_CAPTURE="$PWD/restore-lines.jpg" GEANY_COMMAND_BROWSER_CAPTURE="$PWD/command-browser.jpg" GEANY_WORD_EDIT_CAPTURE="$PWD/word-editing.jpg" GEANY_VIEWPORT_CAPTURE="$PWD/window-scrolling.jpg" GEANY_NAVIGATION_CAPTURE="$PWD/selection-navigation.jpg" GEANY_LINE_OPERATIONS_CAPTURE="$PWD/line-operations.jpg" GEANY_INSIGHT_PREFIX="$PWD/_native-install" GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a -s "-screen 0 1600x1200x24" meson test -C _native --print-errorlogs 'Insight bounded integer renumber' 'Insight native Renumber GUI' 'Insight native column and multiple renumber GUI' 'Insight source mask' 'Insight bounded Replace Files plans' 'Insight native Replace Files preview and guarded buffers GUI' 'Insight native replacement confirmation and 128-file batches GUI' 'Insight cumulative AI edits and prompt usage' 'Insight native editor AI variants and project review GUI' 'Insight compatible AI protocol' 'Insight native console AI and guarded review GUI' 'Insight reference comment regions GUI' 'Insight native relation history GUI' 'Insight expandable Relations tree GUI' 'Insight relation graph geometry' 'Insight relation graph GUI' 'Insight expandable relation graph GUI' 'Insight relation graph viewport GUI' 'Insight relation graph printing GUI' 'Insight source link edit anchors' 'Insight context search' 'Insight unified file search and symbols GUI' 'Insight guarded directory file operations' 'Insight directory comparison snapshots' 'Insight isolated Directory Compare GUI' 'Insight native Directory Compare routing GUI' 'Insight Folder Browser shape and ancestry' 'Insight guarded disk operations' 'Insight isolated disk operation dialogs GUI' 'Insight unindexed disk browser GUI' 'Insight styled HTML serialization and destinations' 'Insight native styled HTML export GUI' 'Insight deterministic project report and export' 'Insight native project report and file list GUI' 'Insight read-only Git history objects' 'Insight native Git history and diff GUI' 'Insight Git project transactions' 'Insight Git project dialogs GUI' 'Insight native Git project GUI' 'Insight bounded selected tree expansion GUI' 'Insight lazy folder tree GUI' 'Insight native lazy folder tree GUI' 'Insight file type editing settings' 'Insight file type editing page GUI' 'Insight native file type editing GUI' 'Insight native typing pairs GUI' 'Insight detailed completion native GUI' 'Insight completion case matching' 'Insight intelligent paste transforms' 'Insight intelligent paste native GUI' 'Insight native smart edges sentence and word fragments GUI' 'Insight original-line restoration plans' 'Insight native original snapshots and Restore Lines GUI' 'Insight guarded backup snapshot store' 'Insight native backup versions GUI' 'Insight native snapshot comparison GUI' 'Insight native Checkpoint and Checkpoint All GUI' 'Insight literal typing repetition plans' 'Insight native typing replay and history GUI' 'Insight Symbol Info and Window List GUI' 'Insight persistent word highlights GUI' 'Insight native selection search and match list GUI' 'Insight delimiter navigation core' 'Insight native delimiter navigation and enclosing pairs GUI' 'Insight native original changes and Restore File GUI' 'Insight native Go Back Toggle GUI' 'Insight native searchable command browser GUI' 'Insight native command and key reference buffers GUI' 'Insight native word cut and character line deletion GUI' 'Insight native viewport scrolling and window edges GUI' 'Insight selection navigation native GUI' 'Insight completion settings' 'Insight completion preferences GUI' 'Insight language profiles GUI' 'Insight file type filters GUI'

      - name: Diagnose native layout failure
        if: failure()
        run: |
          if command -v gdb >/dev/null && test -x _native/tests/test_insight_macos_windows_gui && test -d _native-install; then
            GEANY_TEST_INDEPENDENT_RESTORE=1 GEANY_INSIGHT_PREFIX="$PWD/_native-install" GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a -s "-screen 0 1600x1200x24" timeout 40 gdb -batch -ex 'handle SIGALRM stop nopass' -ex run -ex 'thread apply all bt' --args _native/tests/test_insight_macos_windows_gui || true
          fi
          if command -v gdb >/dev/null && test -x _native/tests/test_insight_panels_gui; then
            GEANY_INSIGHT_PREFIX="$PWD/_native-install" GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a -s "-screen 0 1600x1200x24" timeout 45 gdb -batch -ex run -ex 'thread apply all bt' --args _native/tests/test_insight_panels_gui || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insight-editor-menus
          path: |
            _native/meson-logs/testlog.txt
            project-db-testlog.txt
