name: Insight disk operations
on:
  push:
    branches: [main]
    paths:
      - src/insight-disk-browser.*
      - insight/desktop/disk_operation.*
      - insight/desktop/folder_layout.*
      - insight/tests/folder_layout_test.c
      - insight/desktop/project_files.*
      - insight/tests/disk_operation*_test.c
      - insight/tests/project_files_test.c
      - .github/workflows/insight-disk-operations.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK development and virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev xvfb
      - name: Compile and run core checks
        run: |
          set -eu
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/disk_operation_test.c insight/desktop/disk_operation.c -Iinsight/desktop $(pkg-config --cflags --libs gio-2.0) -o disk-operation-test
          ./disk-operation-test
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/project_files_test.c insight/desktop/project_files.c -Iinsight/desktop $(pkg-config --cflags --libs gio-2.0) -o project-files-test
          ./project-files-test
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/folder_layout_test.c insight/desktop/folder_layout.c -Iinsight/desktop $(pkg-config --cflags --libs glib-2.0) -o folder-layout-test
          ./folder-layout-test
      - name: Compile and run isolated production Folder Browser
        run: |
          set -eu
          cc -std=c99 -Wall -Wextra -Werror -Wno-deprecated-declarations -UNDEBUG -DGTK -DGEANY_PRIVATE insight/tests/disk_operation_gui_test.c src/insight-disk-browser.c insight/desktop/disk_operation.c insight/desktop/folder_layout.c insight/desktop/lookup_filter.c -Isrc -Isrc/tagmanager -Iscintilla/include $(pkg-config --cflags --libs gtk+-3.0) -o disk-operation-gui-test
          GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a ./disk-operation-gui-test
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gtk3 mingw-w64-ucrt-x86_64-pkgconf
      - name: Compile and run core checks
        run: |
          set -eu
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/disk_operation_test.c insight/desktop/disk_operation.c -Iinsight/desktop $(pkg-config --cflags --libs gio-2.0) -o disk-operation-test.exe
          ./disk-operation-test.exe
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/project_files_test.c insight/desktop/project_files.c -Iinsight/desktop $(pkg-config --cflags --libs gio-2.0) -o project-files-test.exe
          ./project-files-test.exe
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/folder_layout_test.c insight/desktop/folder_layout.c -Iinsight/desktop $(pkg-config --cflags --libs glib-2.0) -o folder-layout-test.exe
          ./folder-layout-test.exe
      - name: Compile and run isolated production Folder Browser
        run: |
          set -eu
          cc -std=c99 -Wall -Wextra -Werror -Wno-deprecated-declarations -UNDEBUG -DGTK -DGEANY_PRIVATE insight/tests/disk_operation_gui_test.c src/insight-disk-browser.c insight/desktop/disk_operation.c insight/desktop/folder_layout.c insight/desktop/lookup_filter.c -Isrc -Isrc/tagmanager -Iscintilla/include $(pkg-config --cflags --libs gtk+-3.0) -o disk-operation-gui-test.exe
          GEANY_RUN_GUI_TESTS=1 DISPLAY=win32 GDK_BACKEND=win32 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 ./disk-operation-gui-test.exe
