name: Insight slang CMake 3.10 and GCC 7
on:
  push:
    branches: [main]
    paths:
      - external/slang
      - external/slang-compat/**
      - insight/tools/build_external_slang.py
      - .github/workflows/insight-slang-compat.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu1804:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Checkout runs on the host; Node 24 does not support the old container libc.
      - name: Build and exercise direct slang C++ APIs on the original toolchain
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e DEBIAN_FRONTEND=noninteractive ubuntu:18.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates git g++ make cmake python3
            git config --global --add safe.directory /src
            cmake --version
            g++ --version
            python3 --version
            cmake --version | grep "3.10.2"
            g++ -dumpversion | grep "^7$"
            python3 insight/tools/build_external_slang.py --jobs 2 --check
            python3 insight/tools/build_external_slang.py --prepare-only
          '
      - name: Publish toolchain and compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slang-ubuntu1804-compatibility
          path: |
            _external-slang/source-manifest.json
            _external-slang/Testing/Temporary/LastTest.log
            _external-slang/CMakeCache.txt
