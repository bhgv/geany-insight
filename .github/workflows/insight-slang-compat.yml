name: Insight slang CMake 3.10 and GCC 7
on:
  push:
    branches: [main]
    paths:
      - external/slang
      - external/slang-compat/**
      - insight/tools/build_editor.py
      - insight/tests/slang_build_test.py
      - insight/desktop/slang_completion.*
      - insight/tests/slang_completion_test.c
      - insight/tools/install_slang.py
      - insight/tools/build_external_slang.py
      - .github/workflows/insight-slang-compat.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu1804:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Checkout runs on the host; Node 24 does not support the old container libc.
      - name: Build and exercise direct slang C++ APIs on the original toolchain
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e DEBIAN_FRONTEND=noninteractive ubuntu:18.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates git g++ make cmake python3 pkg-config libglib2.0-dev
            git config --global --add safe.directory /src
            git config --global --add safe.directory /src/external/slang
            cmake --version
            g++ --version
            python3 --version
            cmake --version | grep "3.10.2"
            g++ -dumpversion | grep "^7$"
            python3 insight/tests/slang_build_test.py
            python3 insight/tools/build_editor.py --slang-only --install --prefix /src/_slang-install --jobs 2
            g++ -std=c++17 -DSLANG_STATIC_DEFINE -I/src/_slang-install/lib/geany-insight/slang/include external/slang-compat/probe.cpp -L/src/_slang-install/lib/geany-insight/slang/lib -lsvlang -lfmt -pthread -o /src/_external-slang/installed-sdk-probe
            /src/_external-slang/installed-sdk-probe external/slang-compat/fixtures/leaf.sv external/slang-compat/fixtures/top.sv
            python3 external/slang-compat/semantic-test.py /src/_slang-install/libexec/geany-insight/slang/insight-slang-semantic external/slang-compat/fixtures
            cc -std=c11 -Iinsight/core insight/tests/slang_completion_test.c insight/desktop/slang_completion.c insight/core/index.c insight/desktop/index_cache.c $(pkg-config --cflags --libs gio-2.0) -o /src/_external-slang/editor-completion-probe
            /src/_external-slang/editor-completion-probe /src/_slang-install/libexec/geany-insight/slang/insight-slang-semantic
            python3 insight/tools/build_external_slang.py --prepare-only
          '
      - name: Publish toolchain and compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slang-ubuntu1804-compatibility
          path: |
            _external-slang/source-manifest.json
            _external-slang/Testing/Temporary/LastTest.log
            _external-slang/CMakeCache.txt
