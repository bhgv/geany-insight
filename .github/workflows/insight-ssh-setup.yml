# EN: Validate the production SSH wizard, private credentials and real OpenSSH key enrollment.
# RU: Проверяет настоящий мастер SSH, закрытые пароли и установку ключей OpenSSH.
name: Insight SSH setup
on:
  push:
    branches: [main]
    paths:
      - 'src/insight-ssh-setup*'
      - 'src/insight-ssh-setup/**'
      - 'insight/desktop/ssh_*'
      - 'insight/desktop/remote_*'
      - 'insight/tests/ssh_setup*'
      - 'insight/tests/ssh_auth_helper_test.py'
      - 'insight/tests/ssh_native_client*'
      - 'insight/tests/ssh_askpass_dialog_test.c'
      - 'src/insight-debuggers/gdb-remote-model.inc'
      - 'insight/tools/package_native_windows.py'
      - 'src/insight-askpass.c'
      - 'src/insight-ssh-console.c'
      - 'insight/tests/ssh_console_runner_test.py'
      - '.github/workflows/insight-ssh-setup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wizard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and OpenSSH
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev librsvg2-common shared-mime-info openssh-client xvfb xauth
      - name: Build production models and wizard fixture
        run: |
          cc -Wall -Wextra -Werror=implicit-function-declaration -Iinsight/desktop $(pkg-config --cflags gtk+-3.0 gio-2.0) insight/tests/ssh_setup_test.c insight/desktop/ssh_auth.c insight/desktop/ssh_setup.c insight/desktop/remote_io.c insight/desktop/remote_credentials.c -o ssh-model-test $(pkg-config --libs gtk+-3.0 gio-2.0)
          cc -Wall -Wextra -Werror=implicit-function-declaration -Iinsight/desktop $(pkg-config --cflags gtk+-3.0 gio-2.0) insight/tests/ssh_setup_gui_test.c insight/desktop/ssh_auth.c insight/desktop/ssh_setup.c insight/desktop/remote_io.c insight/desktop/remote_credentials.c -o ssh-wizard-test $(pkg-config --libs gtk+-3.0 gio-2.0)
      - name: Verify persistent SSH console with a real client
        run: |
          cc -Wall -Wextra $(pkg-config --cflags gio-2.0) src/insight-ssh-console.c -o ssh-console-test $(pkg-config --libs gio-2.0)
          python3 insight/tests/ssh_console_runner_test.py ./ssh-console-test /usr/bin/ssh
      - name: Build and verify password reuse in production askpass
        run: |
          cc -Wall -Wextra -Iinsight/desktop $(pkg-config --cflags gtk+-3.0 gio-2.0) src/insight-askpass.c insight/desktop/ssh_auth.c insight/desktop/remote_credentials.c -o ssh-askpass-test $(pkg-config --libs gtk+-3.0 gio-2.0)
          python3 insight/tests/ssh_auth_helper_test.py ./ssh-askpass-test
      - name: Verify credentials and public keys
        run: ./ssh-model-test
      - name: Drive real GTK wizard and capture its pages
        run: INSIGHT_SSH_DIAGNOSTIC_CAPTURE="$PWD/ssh-setup-diagnostics.jpg" INSIGHT_SSH_SERVER_CAPTURE="$PWD/ssh-setup-server.jpg" INSIGHT_SSH_KEYS_CAPTURE="$PWD/ssh-setup-keys.jpg" INSIGHT_SSH_DEBUG_CAPTURE="$PWD/ssh-setup-debug.jpg" GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a -s '-screen 0 1600x1200x24' ./ssh-wizard-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssh-setup-production-widget
          path: ssh-setup-*.jpg
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-paramiko
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Copy native Windows OpenSSH into a Unicode path with spaces
        shell: pwsh
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE 'native SSH клиент'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item "$env:WINDIR\System32\OpenSSH\*" $bin -Recurse
          "INSIGHT_NATIVE_SSH_BIN=$bin" >> $env:GITHUB_ENV
      - name: Build Windows production wizard, askpass and debugger tunnel fixture
        run: |
          bin="$(cygpath -u "$INSIGHT_NATIVE_SSH_BIN")"
          common="insight/desktop/ssh_auth.c insight/desktop/ssh_setup.c insight/desktop/remote_io.c insight/desktop/remote_credentials.c"
          cc -fsyntax-only -DGTK -DGEANY_PRIVATE -I. -Isrc -Isrc/tagmanager -Ictags/main -Iscintilla/include $(pkg-config --cflags gtk+-3.0 gio-2.0) insight/tests/native_debugger_compile_fixture.c
          cc -Wall -Wextra -Iinsight/desktop $(pkg-config --cflags gtk+-3.0 gio-2.0) insight/tests/ssh_setup_gui_test.c $common -o ssh-wizard-test.exe $(pkg-config --libs gtk+-3.0 gio-2.0)
          cc -Wall -Wextra -Iinsight/desktop $(pkg-config --cflags gtk+-3.0 gio-2.0) insight/tests/ssh_native_client_test.c $common -o ssh-tunnel-test.exe $(pkg-config --libs gtk+-3.0 gio-2.0)
          cc -Wall -Wextra $(pkg-config --cflags gio-2.0) src/insight-ssh-console.c -o ssh-console-test.exe $(pkg-config --libs gio-2.0)
          cc -mwindows -Wall -Wextra -Iinsight/desktop $(pkg-config --cflags gtk+-3.0 gio-2.0) src/insight-askpass.c insight/desktop/ssh_auth.c insight/desktop/remote_credentials.c -o ssh-askpass-test.exe $(pkg-config --libs gtk+-3.0 gio-2.0)
      - name: Verify real Windows password and server-key dialogs
        run: |
          cc -mwindows -Wall -Wextra -Iinsight/desktop $(pkg-config --cflags gtk+-3.0 gio-2.0) insight/tests/ssh_askpass_dialog_test.c insight/desktop/ssh_auth.c insight/desktop/remote_credentials.c -o ssh-dialog-test.exe $(pkg-config --libs gtk+-3.0 gio-2.0)
          ./ssh-dialog-test.exe "SSH password"
          ./ssh-dialog-test.exe "Trust fixture server (yes/no)"
      - name: Place compiled askpass into the Unicode runtime directory
        shell: pwsh
        run: |
          Copy-Item ./ssh-askpass-test.exe (Join-Path $env:INSIGHT_NATIVE_SSH_BIN 'geany-insight-askpass.exe')
          Copy-Item ./ssh-console-test.exe (Join-Path $env:INSIGHT_NATIVE_SSH_BIN 'geany-insight-ssh-console.exe')
      - name: Verify native Windows console retention and exit codes
        run: python insight/tests/ssh_console_runner_test.py "$INSIGHT_NATIVE_SSH_BIN/geany-insight-ssh-console.exe" "$INSIGHT_NATIVE_SSH_BIN/ssh.exe"
      - name: Verify saved passwords and legacy passphrases in Windows askpass
        run: python insight/tests/ssh_auth_helper_test.py "$INSIGHT_NATIVE_SSH_BIN/geany-insight-askpass.exe"
      - name: Drive Windows GTK through real native OpenSSH
        if: ${{ !cancelled() }}
        run: python insight/tests/ssh_native_client_fixture.py "$INSIGHT_NATIVE_SSH_BIN" ./ssh-wizard-test.exe ./ssh-tunnel-test.exe
