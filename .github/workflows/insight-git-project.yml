name: Insight Git project
on:
  push:
    branches: [main]
    paths:
      - src/insight-git.*
      - insight/desktop/git_project.*
      - insight/tests/git_project*_test.c
      - .github/workflows/insight-git-project.yml
  workflow_dispatch:
    inputs:
      platform:
        description: 'Application checks: Linux by default; Windows only on request'
        type: choice
        default: linux
        options: [linux, windows]
permissions:
  contents: read
jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y libgtk-3-dev xvfb
      - name: Core transactions and production GTK dialogs
        run: |
          set -eu
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/git_project_test.c insight/desktop/git_project.c $(pkg-config --cflags --libs gio-2.0) -o /tmp/git-core
          /tmp/git-core
          cc -std=c99 -Wall -Wextra -Werror -Wno-deprecated-declarations -UNDEBUG -DGTK -DGEANY_PRIVATE insight/tests/git_project_gui_test.c insight/desktop/git_project.c -Isrc -Isrc/tagmanager -Iscintilla/include $(pkg-config --cflags --libs gtk+-3.0) -o /tmp/git-gui
          GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 xvfb-run -a /tmp/git-gui
  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'windows'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gtk3 mingw-w64-ucrt-x86_64-pkgconf git
      - name: Core transactions and production GTK dialogs
        run: |
          set -eu
          cc -std=c99 -Wall -Wextra -Werror -UNDEBUG insight/tests/git_project_test.c insight/desktop/git_project.c $(pkg-config --cflags --libs gio-2.0) -o git-core.exe
          ./git-core.exe
          cc -std=c99 -Wall -Wextra -Werror -Wno-deprecated-declarations -UNDEBUG -DGTK -DGEANY_PRIVATE insight/tests/git_project_gui_test.c insight/desktop/git_project.c -Isrc -Isrc/tagmanager -Iscintilla/include $(pkg-config --cflags --libs gtk+-3.0) -o git-gui.exe
          GEANY_RUN_GUI_TESTS=1 GSETTINGS_BACKEND=memory DISPLAY=win32 GDK_BACKEND=win32 ./git-gui.exe
