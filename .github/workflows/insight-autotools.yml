name: Insight Autotools and minimum GLib
on:
  push:
    branches: [main]
    paths:
      - src/**
      - insight/**
      - scintilla/**
      - Makefile.am
      - configure.ac
      - m4/**
      - meson.build
      - .github/workflows/insight-autotools.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  autotools:
    runs-on: ubuntu-22.04
    env:
      GLIB_API_CEILING: >-
        -Werror=deprecated-declarations
        -DGLIB_VERSION_MAX_ALLOWED=GLIB_VERSION_2_56
        -DGLIB_VERSION_MIN_REQUIRED=GLIB_VERSION_2_56
        -DGTK_DISABLE_DEPRECATION_WARNINGS
        -DGDK_DISABLE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y autoconf automake autopoint libtool gettext pkg-config libgtk-3-dev libclang-dev libclang-cpp-dev llvm-dev python3-docutils xvfb
      - name: Check source lists and GLib fallback semantics
        run: |
          python3 insight/tests/build_sources_test.py
          cc -std=c99 -Wall -Wextra -Werror insight/tests/glib_compat_test.c $(pkg-config --cflags --libs gio-2.0) -o /tmp/insight-glib-compat
          /tmp/insight-glib-compat
      - name: Verify the API ceiling rejects the original unsupported call
        run: |
          printf '#include <glib.h>\nvoid probe(GQueue *q) { g_queue_clear_full(q, g_free); }\n' > /tmp/glib-api-ceiling.c
          if cc -c $GLIB_API_CEILING /tmp/glib-api-ceiling.c $(pkg-config --cflags glib-2.0) -o /tmp/glib-api-ceiling.o 2>/tmp/glib-api-ceiling.log; then
            echo 'The GLib 2.56 API ceiling did not reject g_queue_clear_full'
            exit 1
          fi
          grep -F g_queue_clear_full /tmp/glib-api-ceiling.log
      - name: Generate configure and build out of tree
        run: |
          NOCONFIGURE=1 ./autogen.sh
          mkdir _autotools
          cd _autotools
          ../configure --prefix="$PWD/install" --disable-html-docs --disable-pdf-docs --disable-api-docs --disable-gtkdoc-header CFLAGS="-O2 -Werror=implicit-function-declaration $GLIB_API_CEILING -DINSIGHT_GLIB_COMPAT_FORCE_FALLBACK=1" CXXFLAGS="-O2 $GLIB_API_CEILING"
          grep -E "^#define HAVE_CLANG_CPP 1" config.h
          ! ldd src/.libs/libgeany.so | grep -E "libclang\.so"
          make -k -j2
      - name: Install and verify linked programs
        run: |
          make -C _autotools install
          test -x _autotools/install/bin/geany-insight-askpass
          ldd -r _autotools/install/lib/libgeany.so 2>&1 | tee _autotools/link-check.txt
          if grep -E 'undefined symbol:|not found' _autotools/link-check.txt; then exit 1; fi
          LD_LIBRARY_PATH="$PWD/_autotools/install/lib" _autotools/install/bin/geany --version
  glib256:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run against actual GLib 2.56 headers and libraries
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src ubuntu:18.04 bash -ec '
            apt-get update -qq
            apt-get install -y --no-install-recommends gcc libc6-dev libglib2.0-dev pkg-config
            pkg-config --modversion gio-2.0
            cc -std=c99 -Wall -Wextra -Werror insight/tests/glib_compat_test.c $(pkg-config --cflags --libs gio-2.0) -o /tmp/glib-compat
            /tmp/glib-compat
          '

  gtk322:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and link the editor against actual GTK 3.22 and GLib 2.56
        timeout-minutes: 15
        run: |
          docker run --rm -v "$PWD:/src:ro" ubuntu:18.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
            apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends gcc g++ make autoconf automake autopoint libtool gettext pkg-config libgtk-3-dev python3-docutils
            pkg-config --modversion gtk+-3.0 gio-2.0
            test "$(pkg-config --modversion gtk+-3.0 | cut -d. -f1,2)" = 3.22
            cp -a /src /tmp/source
            cd /tmp/source
            NOCONFIGURE=1 ./autogen.sh
            mkdir _gtk322 && cd _gtk322
            ../configure --without-libclang --prefix=/tmp/gtk322-install --disable-html-docs --disable-pdf-docs --disable-api-docs --disable-gtkdoc-header CFLAGS="-O2 -Werror=implicit-function-declaration" CXXFLAGS="-O2"
            make -j2
            make install
            ldd -r /tmp/gtk322-install/lib/libgeany.so > link-check.txt 2>&1
            cat link-check.txt
            if grep -E "undefined symbol:|not found" link-check.txt; then exit 1; fi
            LD_LIBRARY_PATH=/tmp/gtk322-install/lib /tmp/gtk322-install/bin/geany --version
          '
